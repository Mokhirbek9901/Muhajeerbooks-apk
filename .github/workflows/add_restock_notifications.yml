name: Add restock notifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add_restock_notifications.yml'
      - 'tools/add_restock_notifications.py'

permissions:
  contents: write

jobs:
  restock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply feature
        run: python3 tools/add_restock_notifications.py
      - name: Verify app
        run: |
          dart format lib/app_state.dart lib/store_ui.dart
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
      - name: Commit feature
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_state.dart lib/store_ui.dart
          git commit -m "Notify customers when sold-out books return"
          git push

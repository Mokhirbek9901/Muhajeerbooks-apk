name: Add sold books admin

on:
  push:
    paths:
      - '.github/workflows/add_sold_books_admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply sold books admin patch
        run: python3 tools/add_sold_books_admin.py
      - name: Get packages
        run: flutter pub get
      - name: Format
        run: dart format lib/admin_ui.dart
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/admin_ui.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Add sold books history to admin panel'
          git push origin main

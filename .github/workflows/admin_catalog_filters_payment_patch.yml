name: Apply admin catalog filters and payment compression

on:
  push:
    paths:
      - 'admin_catalog_filters_payment_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply admin catalog filters and payment compression
        run: python3 tools/admin_catalog_filters_payment_patch.py
      - name: Commit source update
        run: |
          git config user.name "Mokhirbek9901"
          git config user.email "ismoilovmokhirbek@gmail.com"
          git add lib/admin_ui.dart lib/store_ui.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add admin book filters and compress payment proof images"
          git push origin main

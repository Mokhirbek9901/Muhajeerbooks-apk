name: Apply admin problem filters

on:
  push:
    paths:
      - 'admin_problem_filters_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply admin problem filters patch
        run: python3 tools/admin_problem_filters_patch.py
      - name: Commit source update
        run: |
          git config user.name "Mokhirbek9901"
          git config user.email "ismoilovmokhirbek@gmail.com"
          git add lib/admin_ui.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add grouped admin problem and unsold filters"
          git push origin main

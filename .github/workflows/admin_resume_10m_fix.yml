name: Apply admin resume 10m fix

on:
  push:
    paths:
      - 'admin_resume_10m_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply admin resume fix
        run: |
          python3 tools/admin_resume_10m_fix.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/admin_resume_session.dart')
          s = p.read_text(encoding='utf-8').replace('tab.clamp(0, 7)', 'tab.clamp(0, 7).toInt()')
          p.write_text(s, encoding='utf-8')
          p = Path('lib/admin_ui.dart')
          s = p.read_text(encoding='utf-8').replace(
              'tab = widget.initialTab.clamp(0, titles.length - 1);',
              'tab = widget.initialTab.clamp(0, titles.length - 1).toInt();',
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source update
        run: |
          git config user.name "Mokhirbek9901"
          git config user.email "ismoilovmokhirbek@gmail.com"
          git add lib/admin_ui.dart lib/catalog_resume.dart lib/navigation_sync.dart lib/main.dart lib/admin_resume_session.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make admin resume survive iPhone background reloads"
          git push origin main

name: Unified Web + Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/android_build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Keep one Android signing key for future APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: muhajeer-books-apk-signing-v1

      - name: Create Web and Android platform files
        run: flutter create . --platforms=android,web --project-name muhajeerbooks --org com.muhajeerbooks

      - name: Restore or create stable APK signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Muhajeer Books, OU=Mobile, O=Muhajeer Books, L=Gyeongsan, C=KR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - run: flutter pub get

      - name: Prepare Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.muhajeerbooks.app"', s)
          p.write_text(s, encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in m:
              m = m.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />',
                  1,
              )
          m = re.sub(r'android:label="[^"]*"', 'android:label="Muhajeer Books"', m, count=1)
          manifest.write_text(m, encoding='utf-8')
          PY

      - name: Apply official Muhajeer launcher icon
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y imagemagick
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            convert assets/images/muhajeer_logo.jpg -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
          done

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Web from this exact commit
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Build installable APK from this exact commit
        run: |
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_BUILD_NUMBER="${{ github.run_number }}" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Prepare latest APK update files
        run: |
          mkdir -p build/latest-apk
          cp build/app/outputs/flutter-apk/app-release.apk build/latest-apk/muhajeer-books.apk
          VERSION_NAME=$(python3 - <<'PY'
          import re
          text = open('pubspec.yaml', encoding='utf-8').read()
          m = re.search(r'^version:\s*([^+\s]+)', text, re.M)
          print(m.group(1) if m else 'latest')
          PY
          )
          cat > build/latest-apk/app-version.json <<EOF
          {
            "build_number": ${{ github.run_number }},
            "version": "$VERSION_NAME",
            "download_url": "https://github.com/Mokhirbek9901/Muhajeerbooks-apk/releases/download/apk-latest/muhajeer-books.apk",
            "message": "Muhajeer Books yangilandi. Yangi imkoniyatlar va tuzatishlarni olish uchun yangilang."
          }
          EOF

      - name: Publish stable latest APK for installed users
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest \
              --target "$GITHUB_SHA" \
              --title "Muhajeer Books APK" \
              --notes "Android uchun eng so‘nggi Muhajeer Books APK. Ilova yangi versiya chiqqanda shu release orqali yangilanishni taklif qiladi."
          fi
          gh release upload apk-latest \
            build/latest-apk/muhajeer-books.apk \
            build/latest-apk/app-version.json \
            --clobber

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: muhajeer-books-web-build
          path: build/web
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muhajeer-books-installable-apk
          path: build/latest-apk/muhajeer-books.apk
          retention-days: 30

# 2026-09-09: gallery-enabled release build; customer shipping final stage is Jo‘natildi
# 2026-09-10: release build includes support for up to 20 book images
# 2026-09-11: every successful main build publishes a stable latest APK + update manifest

name: Android push compile check (no publication)
on:
  push:
    branches: [main, fix/android-fcm-20261029, fix/android-fcm-config-safety-20261029]
    paths:
      - 'tools/android_push/**'
      - 'tools/prepare_android_fcm.py'
      - 'lib/native_android_push.dart'
      - 'lib/native_customer_notification_bridge.dart'
      - 'config/firebase-android.json'
      - '.github/workflows/android_push_check.yml'
  pull_request:
    paths: ['tools/android_push/**', 'tools/prepare_android_fcm.py', 'lib/native_android_push.dart', 'lib/app_state.dart', 'lib/customer_session.dart', '.github/workflows/android_push_check.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate Android host and wire native FCM
        run: |
          flutter create . --platforms=android --project-name muhajeerbooks --org com.muhajeerbooks
          flutter pub get
          python3 tools/prepare_android_testlab_analytics.py
          python3 tools/prepare_android_biometrics.py
          python3 tools/prepare_android_release_safety.py
          python3 tools/prepare_android_fcm.py
      - name: Compile the Android service and Dart bridge
        run: flutter build apk --debug --dart-define=ANALYTICS_TEST_BUILD=true --dart-define=DEVICE_SMOKE_TEST=true

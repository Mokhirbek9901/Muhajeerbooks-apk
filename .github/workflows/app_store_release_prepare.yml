name: Prepare App Store Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app_store_release_prepare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update App Store version and attach tested build
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: ruby .github/release_tools/prepare_app_store_release.rb

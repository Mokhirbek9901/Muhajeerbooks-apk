name: Apply admin biometrics safe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply_admin_biometrics_safe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_admin_biometrics.py
      - name: Commit app changes
        run: |
          git config user.name "Muhajeer Books Automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/admin_ui.dart lib/finance_admin.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo "No app changes"
            exit 0
          fi
          git commit -m "Add Face ID biometric admin unlock"
          git push

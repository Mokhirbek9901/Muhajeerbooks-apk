name: Apply mobile price layout fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_price_layout_fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply fix
        run: python tools/fix_book_detail_price_layout.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/store_ui.dart
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile book price layout"
          git push

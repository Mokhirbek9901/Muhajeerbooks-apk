name: Apply Uzbek UI polish v4

on:
  push:
    paths:
      - '.github/uzbek_polish_v4.trigger'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply safe visual polish
        run: python3 tools/apply_uzbek_polish_v4.py

      - name: Format
        run: dart format lib/design_system.dart lib/store_ui.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Commit polished UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/design_system.dart lib/store_ui.dart
          if git diff --cached --quiet; then
            echo "No UI polish changes to commit"
            exit 0
          fi
          git commit -m "Polish app with Uzbek visual design"
          git push

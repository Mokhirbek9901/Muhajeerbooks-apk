name: Apply Uzbek storefront redesign

on:
  push:
    paths:
      - '.github/redesign_v3.trigger'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply redesign
        run: python3 tools/redesign_uzbek_ui_v3.py

      - name: Format
        run: dart format lib/design_system.dart lib/uzbek_customer_style.dart lib/store_ui.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/design_system.dart lib/uzbek_customer_style.dart lib/store_ui.dart
          if git diff --cached --quiet; then
            echo "No redesign changes to commit"
            exit 0
          fi
          git commit -m "Redesign customer app with Uzbek visual system"
          git push

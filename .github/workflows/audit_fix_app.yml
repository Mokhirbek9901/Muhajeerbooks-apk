name: App final hardening

on:
  push:
    paths:
      - '.github/workflows/audit_fix_app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply final hardening
        run: python3 tools/audit_fix_app.py
      - name: Format
        run: dart format lib/app_state.dart test/order_rules_test.dart
      - name: Packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Critical invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/app_state.dart').read_text(encoding='utf-8')
          assert "muhajeer_orders_v4" in s
          assert "muhajeer_customer_notices_v2" in s
          assert "final safeDeliveryFee = cartCount >= 4 ? 0 : AppState.deliveryFee;" in s
          assert "throw StateError('To‘lov chekini tanlang.');" in s
          assert "_customerPhoneKey" in s
          assert not Path('lib/checkout_page.dart').exists()
          assert not Path('lib/main.dart2').exists()
          print('Critical app invariants OK')
          PY
      - name: Commit hardened app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lib test
          git diff --cached --quiet && exit 0
          git commit -m 'Harden checkout and reset test order history'
          git push origin main

name: App audit fixes

on:
  push:
    paths:
      - '.github/workflows/audit_fix_app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply audit fixes
        run: python3 tools/audit_fix_app.py
      - name: Format
        run: dart format lib/app_state.dart lib/admin_ui.dart
      - name: Packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app_state.dart lib/admin_ui.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Fix final sales accounting and order source ownership'
          git push origin main

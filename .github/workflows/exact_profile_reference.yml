name: Apply exact profile reference layout
on:
  push:
    paths:
      - '.github/workflows/exact_profile_reference.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact profile layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/store_ui.dart')
          s = p.read_text()

          # Match the supplied reference card proportions.
          s = s.replace('height: 300,', 'height: 205,', 1)

          # Keep the detailed background visible under the ornamental overlay.
          s = s.replace(
              "colors: [Color(0xFF06234C), Color(0xFF074F6A), Color(0xFF061D43)],",
              "colors: [Color(0xB806234C), Color(0xA8074F6A), Color(0xB8061D43)],",
              1,
          )

          # Reference has three action cards directly below the profile card.
          start = s.find("          const SizedBox(height: 12),\n          Row(\n            children: [\n              Expanded(\n                child: _ProfileStat")
          end_marker = "          const SizedBox(height: 19),"
          if start != -1:
              end = s.find(end_marker, start)
              if end == -1:
                  raise SystemExit('profile action block end not found')
              replacement = """          const SizedBox(height: 12),
          Row(
            children: [
              Expanded(
                child: _ProfileReferenceAction(
                  icon: Icons.shopping_bag_outlined,
                  label: 'Buyurtmalarim',
                  onTap: () => Navigator.push(
                    context,
                    muhajeerPageRoute(
                      settings: const RouteSettings(name: 'mb:orders'),
                      builder: (_) => const MyOrdersPage(),
                    ),
                  ),
                ),
              ),
              const SizedBox(width: 8),
              Expanded(
                child: _ProfileReferenceAction(
                  icon: Icons.favorite_border_rounded,
                  label: 'Sevimlilarim',
                  onTap: () => Navigator.push(
                    context,
                    muhajeerPageRoute(
                      settings: const RouteSettings(name: 'mb:favorites'),
                      builder: (_) => const FavoritesPage(),
                    ),
                  ),
                ),
              ),
              const SizedBox(width: 8),
              Expanded(
                child: _ProfileReferenceAction(
                  icon: Icons.settings_outlined,
                  label: 'Sozlamalar',
                  onTap: () {
                    final controller = PrimaryScrollController.maybeOf(context);
                    controller?.animateTo(
                      controller.position.maxScrollExtent,
                      duration: const Duration(milliseconds: 350),
                      curve: Curves.easeOutCubic,
                    );
                  },
                ),
              ),
            ],
          ),
"""
              s = s[:start] + replacement + s[end:]

          # Tighten typography/gaps to the reference without changing dynamic user data.
          s = s.replace("fontSize: 17, fontWeight: FontWeight.w700, letterSpacing: .5", "fontSize: 15, fontWeight: FontWeight.w700, letterSpacing: .5", 1)
          s = s.replace("const SizedBox(height: 13),\n                      Container(", "const SizedBox(height: 9),\n                      Container(", 1)
          s = s.replace("const SizedBox(height: 14),\n                      const Row(children:", "const SizedBox(height: 9),\n                      const Row(children:", 1)
          s = s.replace("const SizedBox(height: 10),\n                      const Text('Koreyadagi O‘zbek kitobxonlari uchun'", "const SizedBox(height: 6),\n                      const Text('Koreyadagi O‘zbek kitobxonlari uchun'", 1)
          p.write_text(s)
          PY
      - name: Commit real app source
        run: |
          git config user.name 'Mokhirbek9901'
          git config user.email 'ismoilovmokhirbek@gmail.com'
          git add lib/store_ui.dart
          if git diff --cached --quiet; then
            echo 'No source change'
            exit 0
          fi
          git commit -m 'Apply supplied profile design to live app source'
          git push origin main

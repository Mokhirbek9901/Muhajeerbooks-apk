name: Exclude cancelled order numbers

on:
  push:
    branches: [main]
    paths:
      - 'tools/exclude_cancelled_order_numbers.py'
      - '.github/workflows/exclude_cancelled_order_numbers.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python tools/exclude_cancelled_order_numbers.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/admin_ui.dart
          git commit -m "Hide order number for cancelled orders"
          git push

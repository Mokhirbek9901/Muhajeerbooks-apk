name: Read-only Firebase IAM capability probe (no publication)
on:
  push:
    branches: [build/android-fcm-device-test-20261030]
    paths: ['.github/workflows/firebase_config_probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet google-auth==2.62.0 requests==2.32.5
      - name: Check existing project permissions without changing IAM
        env:
          EXISTING_GOOGLE_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          report = {'project':'muhajeer-books-push'}
          wanted = ['iam.serviceAccounts.create','iam.serviceAccountKeys.create',
                    'iam.roles.create','resourcemanager.projects.getIamPolicy',
                    'resourcemanager.projects.setIamPolicy','cloudmessaging.messages.create']
          try:
              raw = os.environ.get('EXISTING_GOOGLE_JSON', '')
              report['existing_credential_present'] = bool(raw.strip())
              if raw.strip():
                  info = json.loads(raw)
                  info['token_uri'] = 'https://oauth2.googleapis.com/token'
                  credential = service_account.Credentials.from_service_account_info(
                      info, scopes=['https://www.googleapis.com/auth/cloud-platform.read-only'])
                  credential = credential.with_quota_project('muhajeer-books-push')
                  session = AuthorizedSession(credential)
                  response = session.post(
                      'https://cloudresourcemanager.googleapis.com/v1/projects/muhajeer-books-push:testIamPermissions',
                      json={'permissions':wanted}, timeout=20)
                  report['iam_test_http'] = response.status_code
                  result = response.json()
                  if response.status_code == 200:
                      report['granted_requested_permissions'] = [
                          p for p in result.get('permissions',[]) if p in wanted]
                  else:
                      error = result.get('error',{})
                      report['error_status'] = error.get('status','UNKNOWN')
                      report['error_reasons'] = [
                          d.get('reason') for d in error.get('details',[])
                          if isinstance(d,dict) and re.fullmatch(r'[A-Z_]{1,80}',str(d.get('reason','')))]
          except Exception as error:
              report['error_type'] = type(error).__name__
          print(json.dumps(report,indent=2))
          PY

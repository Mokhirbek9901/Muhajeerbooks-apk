name: Fix image upload linking

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fix_image_upload_linking.py'
      - '.github/workflows/fix-image-upload-linking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply image upload fix
        run: python3 tools/fix_image_upload_linking.py

      - name: Commit source changes
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin_ui.dart lib/app_state.dart nginx.conf
          git commit -m "Fix image upload reliability"
          git push

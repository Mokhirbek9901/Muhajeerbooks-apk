name: Fix admin background refresh flicker

on:
  push:
    paths:
      - '.github/workflows/fix_admin_customer_refresh.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep admin data visible during 5-second refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/admin_ui.dart')
          s = p.read_text(encoding='utf-8')
          original = s

          overview_old = """      if (snap.connectionState == ConnectionState.waiting)\n        return const Center(child: CircularProgressIndicator());\n"""
          overview_new = """      // Faqat birinchi yuklanishda katta spinner ko‘rsatamiz.\n      // 5 soniyalik fon yangilanishida oldingi ma’lumot ekranda qoladi.\n      if (snap.connectionState == ConnectionState.waiting && snap.data == null) {\n        return const Center(child: CircularProgressIndicator());\n      }\n"""
          s = s.replace(overview_old, overview_new, 1)

          customers_old = """        if (snapshot.connectionState == ConnectionState.waiting) {\n          return const Center(child: CircularProgressIndicator());\n        }\n"""
          customers_new = """        // Faqat birinchi yuklanishda katta spinner ko‘rsatamiz.\n        // Har 5 soniyadagi fon yangilanishida mijozlar ro‘yxati ekranda qoladi.\n        if (snapshot.connectionState == ConnectionState.waiting &&\n            snapshot.data == null) {\n          return const Center(child: CircularProgressIndicator());\n        }\n"""
          s = s.replace(customers_old, customers_new, 1)

          if s == original:
              print('Refresh conditions already fixed or source changed; no patch needed.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Admin background refresh UI patched.')
          PY

      - name: Setup Flutter
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate
        if: hashFiles('pubspec.yaml') != ''
        run: |
          flutter pub get
          dart format lib/admin_ui.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/admin_ui.dart
          git commit -m 'Keep admin data visible during background refresh'
          git pull --rebase origin main
          git push origin HEAD:main

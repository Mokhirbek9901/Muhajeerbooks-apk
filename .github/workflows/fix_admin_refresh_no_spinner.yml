name: Fix admin refresh spinner

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_admin_refresh_no_spinner.py'
      - '.github/workflows/fix_admin_refresh_no_spinner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply no-spinner admin refresh fix
        run: python3 tools/fix_admin_refresh_no_spinner.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin_ui.dart
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Stop admin auto-refresh loading flicker"
            git push
          fi

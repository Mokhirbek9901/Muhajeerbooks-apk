name: Fix customer logout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fix_customer_logout.py'
      - '.github/workflows/fix_customer_logout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply logout fix
        run: python3 tools/fix_customer_logout.py
      - name: Format
        run: dart format lib/app_state.dart lib/store_ui.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app_state.dart lib/store_ui.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Fix customer logout and remember verification state'
          git push

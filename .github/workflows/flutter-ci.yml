name: Flutter CI

on:
  push:
    branches: [main, feature/store-app-v2]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform folders if missing
        run: flutter create . --platforms=android,ios,web
      - run: flutter pub get
      - run: flutter analyze

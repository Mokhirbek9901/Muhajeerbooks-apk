name: Flutter CI

on:
  push:
    branches: [main, feature/store-app-v2, fix/mb2108-all-approved-20261027, fix/batch-picker-and-professional-6494-20261028, fix/android-fcm-20261029, fix/android-fcm-config-safety-20261029]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python API syntax
        run: python3 -m py_compile server/app.py server/preorder_delivery.py server/preorder_native_push.py server/native_customer_push.py server/native_android_push.py tools/prepare_android_fcm.py
      - name: Test Android FCM routing and native host generation
        run: |
          python3 -m unittest discover -s server/tests -p 'test_native_android_push.py' -v
          python3 -m unittest discover -s server/tests -p 'test_android_fcm_prepare.py' -v
      - name: Test private customer/admin APNs routing (mocked)
        run: python3 -m unittest discover -s server/tests -p 'test_native_customer_push.py' -v
      - name: Test admin OpenAI failure handling (mocked, no API charge)
        run: python3 -m unittest discover -s server/tests -p 'test_admin_research_api.py' -v
      - name: Check Android release configuration regression
        run: python3 -m unittest discover -s server/tests -p 'test_android_release_safety.py' -v
      - name: Protect PINless web and legacy admin preorder actions
        run: python3 -m unittest discover -s server/tests -p 'test_pinless_web_preorder_compat.py' -v
      - name: Test preorder APNs/FCM private delivery and old web push compatibility
        run: |
          python3 -m pip install --quiet flask==3.1.2 requests==2.32.5
          python3 -m unittest discover -s server/tests -p 'test_preorder_delivery.py' -v
          python3 -m unittest discover -s server/tests -p 'test_preorder_native_push.py' -v
      - name: Test compact image storage and duplicate reuse
        run: node --test server/tests/book_image_storage_policy.test.mjs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Check manual App Store preparation and public-release guard
        run: |
          ruby -c .github/release_tools/app_store_client.rb
          ruby -c .github/release_tools/hold_app_store_versions.rb
          ruby -c .github/release_tools/verify_testflight_candidate.rb
          ruby -c .github/release_tools/prepare_app_store_release.rb
          ruby -c .github/release_tools/submit_app_store_update.rb
          ruby -c .github/release_tools/repair_app_review.rb
          python3 -m unittest discover -s server/tests -p 'test_store_release_gates.py' -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Create platform folders if missing
        run: flutter create . --platforms=android,ios,web
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Verify iOS TestFlight full web preview
        run: flutter test --dart-define=TESTFLIGHT_PREVIEW=true --dart-define=APP_STORE_BUILD=true
      - name: Verify full Android and App Store candidate features
        run: flutter test --dart-define=STORE_FEATURES=true --dart-define=PLAY_STORE_BUILD=true
      - name: Verify Korea order timestamps and day boundaries
        env:
          TZ: Asia/Seoul
        run: flutter test test/order_time_test.dart --dart-define=REQUIRE_KOREA_TIME=true
      - name: Build the web release
        run: flutter build web --release --dart-define=ANALYTICS_TEST_BUILD=true
      - name: Upload story previews and resolved dependencies
        uses: actions/upload-artifact@v4
        with:
          name: story-preview
          path: |
            build/test-artifacts/*.png
            pubspec.lock
          retention-days: 7

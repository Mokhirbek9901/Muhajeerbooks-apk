name: Global order number patch

on:
  push:
    branches: [main]
    paths:
      - 'tools/global_order_number_patch.py'
      - '.github/workflows/global_order_number_patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply global order numbering
        run: python3 tools/global_order_number_patch.py
      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_state.dart lib/admin_ui.dart
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use global four-digit order numbers"
            git push
          fi

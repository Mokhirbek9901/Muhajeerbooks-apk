name: Hide customer admin entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide_admin_entry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Hide visible admin button and keep secret access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/store_ui.dart')
          s = path.read_text(encoding='utf-8')

          def widget_span(src, anchor, widget_start):
              anchor_pos = src.find(anchor)
              if anchor_pos < 0:
                  raise SystemExit(f'Anchor not found: {anchor}')
              start = src.rfind(widget_start, 0, anchor_pos)
              if start < 0:
                  raise SystemExit(f'Widget start not found for: {anchor}')
              line_start = src.rfind('\n', 0, start) + 1
              open_pos = src.find('(', start)
              depth = 0
              end = None
              for i in range(open_pos, len(src)):
                  ch = src[i]
                  if ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'Widget end not found for: {anchor}')
              while end < len(src) and src[end] in ' \t':
                  end += 1
              if end < len(src) and src[end] == ',':
                  end += 1
              if end < len(src) and src[end] == '\r':
                  end += 1
              if end < len(src) and src[end] == '\n':
                  end += 1
              indent = src[line_start:start]
              return line_start, end, indent

          # Remove the visible Admin paneli row from the customer profile.
          admin_start, admin_end, _ = widget_span(s, "'Admin paneli'", 'ListTile(')
          admin_block = s[admin_start:admin_end]
          if 'AdminGatePage' not in admin_block:
              raise SystemExit('Refusing to remove unexpected ListTile')
          s = s[:admin_start] + s[admin_end:]

          # Keep owner access hidden: long-press the profile name, then the existing
          # server-verified admin code screen opens. Nothing admin-related is visible.
          name_start, name_end, indent = widget_span(s, "'Mohirbek Ismoilov'", 'const Text(')
          lines = [
              'GestureDetector(',
              '  behavior: HitTestBehavior.opaque,',
              '  onLongPress: () => Navigator.push(',
              '    context,',
              '    MaterialPageRoute(builder: (_) => const AdminGatePage()),',
              '  ),',
              '  child: const Padding(',
              '    padding: EdgeInsets.symmetric(vertical: 4),',
              '    child: Text(',
              "      'Mohirbek Ismoilov',",
              '      textAlign: TextAlign.center,',
              '      style: TextStyle(',
              '        color: Colors.white,',
              '        fontSize: 23,',
              '        fontWeight: FontWeight.w900,',
              '        letterSpacing: -.3,',
              '      ),',
              '    ),',
              '  ),',
              '),',
          ]
          replacement = '\n'.join(indent + line for line in lines) + '\n'
          s = s[:name_start] + replacement + s[name_end:]

          if "'Admin paneli'" in s:
              raise SystemExit('Visible admin text still present')
          if s.count('onLongPress: () => Navigator.push(') < 1:
              raise SystemExit('Hidden admin access was not added')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Format
        run: dart format lib/store_ui.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Web build
        run: |
          flutter create . --platforms=web
          flutter build web --release

      - name: Commit production change and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/hide_admin_entry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Hide admin panel entry from customers'
          git push

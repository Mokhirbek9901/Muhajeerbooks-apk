name: Instagram shipping tab patch

on:
  push:
    paths:
      - 'instagram_shipping_tab_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Instagram shipping tab patch
        run: python3 tools/instagram_shipping_tab_patch.py
      - name: Commit source update
        run: |
          git config user.name "Mokhirbek9901"
          git config user.email "ismoilovmokhirbek@gmail.com"
          git add lib/admin_ui.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Show Instagram shipping orders in admin"
          git push origin main

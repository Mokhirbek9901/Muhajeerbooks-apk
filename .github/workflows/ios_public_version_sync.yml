name: Sync public App Store update requirement
on:
  schedule:
    # Apple public release and App Store indexing can be delayed.
    # Compare only versions Apple marks READY_FOR_SALE.
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios_public_version_sync.yml'
      - '.github/release_tools/sync_public_ios_update.rb'
  pull_request:
    paths:
      - '.github/workflows/ios_public_version_sync.yml'
      - '.github/release_tools/sync_public_ios_update.rb'

permissions:
  contents: read

concurrency:
  group: ios-public-version-config-sync
  cancel-in-progress: false

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby -c .github/release_tools/sync_public_ios_update.rb

  update-server-config:
    needs: syntax
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Sync only the latest Apple READY_FOR_SALE release
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: ruby .github/release_tools/sync_public_ios_update.rb

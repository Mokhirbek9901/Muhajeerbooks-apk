name: Apply iPhone scroll stability fix

on:
  push:
    paths:
      - 'iphone_scroll_stability_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply iPhone scroll stability patch
        run: python3 tools/iphone_scroll_stability_fix.py
      - name: Commit source update
        run: |
          git config user.name "Mokhirbek9901"
          git config user.email "ismoilovmokhirbek@gmail.com"
          git add lib/store_ui.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Keep iPhone back navigation at the same scroll position"
          git push origin main

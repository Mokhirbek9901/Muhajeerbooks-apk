name: Live synchronization polish

on:
  push:
    branches: [main]
    paths:
      - 'tools/live_sync_patch.py'
      - '.github/workflows/live-sync-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply live sync patch
        run: python3 tools/live_sync_patch.py
      - name: Format
        run: dart format lib/app_state.dart lib/admin_ui.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Release web build
        run: flutter build web --release
      - name: Sanity checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('lib/app_state.dart').read_text(encoding='utf-8')
          u=Path('lib/admin_ui.dart').read_text(encoding='utf-8')
          assert "muhajeer-books-catalog-live" in a
          assert "PostgresChangeEvent.all" in a
          assert "_refreshBooksQuietly" in a
          assert "Duration(seconds: 20)" in a
          assert "_liveRefreshTimer" in u
          assert "Duration(seconds: 5)" in u
          assert "loadQuietly" in u
          print('live sync sanity OK')
          PY
      - name: Commit production live sync and cleanup
        run: |
          rm -f tools/live_sync_patch.py .github/workflows/live-sync-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_state.dart lib/admin_ui.dart tools/live_sync_patch.py .github/workflows/live-sync-polish.yml
          git commit -m "Keep catalog inventory and admin live synchronized"
          git push

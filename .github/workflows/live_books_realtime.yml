name: Live books realtime patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live_books_realtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply realtime patch
        run: python3 tools/live_books_realtime_patch.py
      - name: Format
        run: dart format lib/app_state.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Web build
        run: flutter build web --release
      - name: Commit realtime patch
        run: |
          rm .github/workflows/live_books_realtime.yml
          rm tools/live_books_realtime_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_state.dart .github/workflows/live_books_realtime.yml tools/live_books_realtime_patch.py
          git commit -m "Add realtime book inventory sync"
          git push

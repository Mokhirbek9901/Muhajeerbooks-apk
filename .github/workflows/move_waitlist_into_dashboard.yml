name: Move waitlist into dashboard

on:
  push:
    branches: [main]
    paths:
      - 'tools/move_waitlist_into_dashboard.py'
      - '.github/workflows/move_waitlist_into_dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply waitlist dashboard patch
        run: python3 tools/move_waitlist_into_dashboard.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin_ui.dart
          git commit -m "Move Kutayotganlar into Boshqaruv markazi"
          git push

name: Optimize existing book covers

on:
  push:
    branches: [main]
    paths:
      - 'tools/optimize_existing_book_covers.py'
      - '.github/workflows/optimize_existing_book_covers.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/optimize_existing_book_covers.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib/admin_ui.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Keep only intended source change
        run: |
          git checkout -- analysis_options.yaml pubspec.lock || true
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin_ui.dart
          if git diff --cached --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git commit -m "Optimize existing main book covers in background"
          git push origin main

name: Apply order filters and Korean phone checkout

on:
  push:
    paths:
      - 'order_filters_phone_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply order filters and phone patch
        run: python3 tools/order_filters_phone_patch.py
      - name: Commit source update
        run: |
          git config user.name "Mokhirbek9901"
          git config user.email "ismoilovmokhirbek@gmail.com"
          git add lib/admin_ui.dart lib/store_ui.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add today yesterday order filters and Korean phone format"
          git push origin main

name: Publish owner-approved Android 1190

on:
  pull_request:
    paths:
      - '.github/workflows/play_promote_1190.yml'
      - '.github/play-production-approval-1190.json'
      - 'tools/promote_play_tested_candidate.py'
      - 'server/tests/test_play_production_promotion.py'
  push:
    branches: [main]
    paths: ['.github/play-production-approval-1190.json']

permissions:
  contents: read
  actions: read
concurrency:
  group: owner-approved-play-production-1190
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact approval, binary selection and halted-release preservation
        run: PYTHONPATH=tools python3 -m unittest discover -s server/tests -p 'test_play_production_promotion.py' -v
  release:
    needs: validate
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OWNER_APPROVED_PUBLIC_RELEASE: 'com.muhajeerbooks.app:2.5.20:1190'
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'promote' || 'inspect' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the exact successful candidate and CI provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/actions/runs/40678301551 > "$RUNNER_TEMP/candidate-run.json"
          gh api repos/$GITHUB_REPOSITORY/actions/runs/40678301551/jobs > "$RUNNER_TEMP/candidate-jobs.json"
          gh api repos/$GITHUB_REPOSITORY/actions/runs/40678301691 > "$RUNNER_TEMP/candidate-ci.json"
          gh api repos/$GITHUB_REPOSITORY/actions/runs/40678301551/artifacts > "$RUNNER_TEMP/candidate-artifacts.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          source='44917f721778c08e0e660a172c02bf1c4757f4b4'
          run=json.loads((root/'candidate-run.json').read_text())
          ci=json.loads((root/'candidate-ci.json').read_text())
          for item in [run,ci]:
              assert item['head_sha']==source and item['head_branch']=='main' and item['conclusion']=='success'
          assert run['path']=='.github/workflows/play_release.yml'
          assert ci['path']=='.github/workflows/flutter-ci.yml'
          jobs=json.loads((root/'candidate-jobs.json').read_text())['jobs']
          for name in ['android-smoke (28)','android-smoke (35)','build']:
              assert any(j['name']==name and j['conclusion']=='success' for j in jobs), name
          artifacts=json.loads((root/'candidate-artifacts.json').read_text())['artifacts']
          artifact=next(a for a in artifacts if a['name']=='play-owner-test-candidate')
          assert not artifact['expired']
          assert artifact['digest']=='sha256:9b301db859d7b9d138d21dc63b1fabb78aa5de719e7b3325e93e39216435e392'
          PY
          gh run download 40678301551 --repo "$GITHUB_REPOSITORY" --name play-owner-test-candidate --dir "$RUNNER_TEMP/candidate-evidence"
      - name: Install Google API client dependencies
        run: python3 -m pip install --quiet google-auth requests
      - name: Inspect or publish the existing owner-tested binary
        run: |
          python3 tools/promote_play_tested_candidate.py "$MODE" \
            --approval .github/play-production-approval-1190.json \
            --evidence-dir "$RUNNER_TEMP/candidate-evidence" \
            --output "$RUNNER_TEMP/play-production-1190.json"
      - name: Preserve inspection or publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-production-1190-${{ github.event_name }}
          path: ${{ runner.temp }}/play-production-1190.json
          retention-days: 90

name: Premium Muhajeer polish

on:
  push:
    branches: [main]
    paths:
      - 'tools/premium_polish.py'
      - 'lib/design_system.dart'
      - '.github/workflows/premium_polish_once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply premium polish
        run: python tools/premium_polish.py

      - name: Format Dart
        run: dart format lib

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Validate web release build
        run: |
          tmpdir=$(mktemp -d)
          cp -a . "$tmpdir/app"
          rm -rf "$tmpdir/app/.git"
          cd "$tmpdir/app"
          flutter create . --platforms=web
          flutter build web --release

      - name: Remove one-shot helpers
        run: rm -f tools/premium_polish.py .github/workflows/premium_polish_once.yml

      - name: Commit polished release
        run: |
          git config user.name "Muhajeer Books Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Polish Muhajeer Books storefront and admin experience"
          git push

name: Professional Muhajeer Books upgrade

on:
  push:
    branches: [main]
    paths:
      - 'tools/professional_upgrade.py'
      - '.github/workflows/professional_upgrade_once.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply professional upgrade
        run: python tools/professional_upgrade.py

      - name: Format
        run: dart format lib

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Remove one-shot helpers
        run: rm -f tools/professional_upgrade.py .github/workflows/professional_upgrade_once.yml

      - name: Commit release
        run: |
          git config user.name "Muhajeer Books Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Professionalize storefront, admin and order payments"
          git push

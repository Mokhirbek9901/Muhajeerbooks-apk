name: Professional Muhajeer Books upgrade

on:
  push:
    branches: [main]
    paths:
      - 'tools/professional_upgrade.py'
      - '.github/workflows/professional_upgrade_once.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix AppState patch scope
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/professional_upgrade.py')
          text = p.read_text(encoding='utf-8')
          old = 'text = replace_between(text, "  Future<void> updateOrderStatus(String id, String status) async {", "  Future<void> resetLocalCatalogFromTelegram() async {", local_status, "local status flow")'
          new = '''app_anchor = text.find("class AppState extends ChangeNotifier {")
          if app_anchor < 0:
              raise SystemExit("AppState anchor not found")
          status_start = text.find("  Future<void> updateOrderStatus(String id, String status) async {", app_anchor)
          if status_start < 0:
              raise SystemExit("AppState updateOrderStatus not found")
          status_end = text.find("  Future<void> resetLocalCatalogFromTelegram() async {", status_start)
          if status_end < 0:
              raise SystemExit("AppState reset marker not found")
          text = text[:status_start] + local_status.rstrip() + "\\n\\n" + text[status_end:]'''
          if old not in text:
              raise SystemExit('Old ambiguous status patch not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply professional upgrade
        run: python tools/professional_upgrade.py

      - name: Format
        run: dart format lib

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Remove one-shot helpers
        run: rm -f tools/professional_upgrade.py .github/workflows/professional_upgrade_once.yml

      - name: Commit release
        run: |
          git config user.name "Muhajeer Books Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Professionalize storefront, admin and order payments"
          git push

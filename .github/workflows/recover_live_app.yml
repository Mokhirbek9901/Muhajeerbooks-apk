name: Recover live app catalog

on:
  push:
    paths:
      - '.github/workflows/recover_live_app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply recovery patch
        run: python3 tools/recover_live_app.py
      - name: Format
        run: dart format lib/app_state.dart lib/main.dart
      - name: Packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Commit recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app_state.dart lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Recover live catalog and stale auth state'
          git push origin main

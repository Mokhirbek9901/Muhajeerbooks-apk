name: Reduce Supabase background pressure

on:
  push:
    paths:
      - '.github/workflows/reduce_supabase_background_pressure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reduce background polling safely
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('lib/app_state.dart')
          text = path.read_text(encoding='utf-8')

          text, order_count = re.subn(
              r'(_orderStatusTimer\s*=\s*Timer\.periodic\(\s*\n\s*)const Duration\(seconds:\s*30\)',
              r'\1const Duration(seconds: 60)',
              text,
              count=1,
          )
          text, books_count = re.subn(
              r'_booksFallbackTimer\s*=\s*Timer\.periodic\(const Duration\(seconds:\s*20\)',
              '_booksFallbackTimer = Timer.periodic(const Duration(seconds: 45)',
              text,
              count=1,
          )

          if order_count != 1:
              raise SystemExit(f'order status timer replacements: {order_count}')
          if books_count != 1:
              raise SystemExit(f'books timer replacements: {books_count}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          git diff --check
          grep -A2 "_orderStatusTimer = Timer.periodic" lib/app_state.dart | grep -q "Duration(seconds: 60)"
          grep -q "_booksFallbackTimer = Timer.periodic(const Duration(seconds: 45)" lib/app_state.dart
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_state.dart
          git commit -m "Reduce Supabase background polling pressure"
          git push

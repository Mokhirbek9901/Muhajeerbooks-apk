name: Remove Gyeongsan free delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove_gyeongsan_free.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove Gyeongsan free option
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/store_ui.dart')
          s = path.read_text(encoding='utf-8')

          fee_pattern = re.compile(
              r"final deliveryFee = delivery == 'Gyeongsan' \|\| state\.cartCount >= 4\s*\?\s*0\s*:\s*AppState\.deliveryFee;"
          )
          s, fee_count = fee_pattern.subn(
              "final deliveryFee = state.cartCount >= 4 ? 0 : AppState.deliveryFee;",
              s,
              count=1,
          )
          if fee_count != 1:
              raise SystemExit(f'Expected 1 Gyeongsan fee rule, found {fee_count}')

          option_pattern = re.compile(
              r"\s*const Divider\(height: 1\),\s*"
              r"RadioListTile<String>\(\s*"
              r"value: 'Gyeongsan',\s*"
              r"groupValue: delivery,\s*"
              r"onChanged: \(v\) => setState\(\(\) => delivery = v!\),\s*"
              r"title: const Text\(\s*"
              r"'Gyeongsan ichida',\s*"
              r"style: TextStyle\(fontWeight: FontWeight\.w800\),\s*"
              r"\),\s*"
              r"subtitle: const Text\('Bepul yetkazib berish'\),\s*"
              r"\),",
              re.S,
          )
          s, option_count = option_pattern.subn('\n', s, count=1)
          if option_count != 1:
              raise SystemExit(f'Expected 1 Gyeongsan option, found {option_count}')

          if 'Gyeongsan' in s:
              raise SystemExit('Gyeongsan text still remains in store_ui.dart')
          if "delivery == 'Gyeongsan'" in s:
              raise SystemExit('Gyeongsan free-delivery rule still remains')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Format
        run: dart format lib/store_ui.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Web build
        run: |
          flutter create . --platforms=web
          flutter build web --release

      - name: Commit production change and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/remove_gyeongsan_free.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Remove Gyeongsan free delivery option'
          git push

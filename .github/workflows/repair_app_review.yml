name: Verify App Store owner hold (legacy review disabled)

# The old automatic 1041 submission is retired. This manual diagnostic only
# reads versions and verifies MANUAL holds; it cannot submit a public review.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-owner-hold:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner-controlled App Store release
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: ruby .github/release_tools/hold_app_store_versions.rb

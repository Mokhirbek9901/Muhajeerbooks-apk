name: Restore old storefront look

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/restore_old_store_look.py'
      - '.github/workflows/restore_old_store_look.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore old storefront layout
        run: python3 tools/restore_old_store_look.py

      - name: Format
        run: dart format lib/main.dart lib/store_ui.dart lib/auth_gate.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Commit restored look
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart lib/store_ui.dart lib/auth_gate.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Match APK to original Muhajeer storefront'
          git push

name: Separate app and Telegram order management

on:
  push:
    paths:
      - 'tools/separate_order_sources_patch.py'
      - '.github/workflows/separate_order_sources_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/separate_order_sources_patch.py
      - name: Basic validation
        run: |
          grep -q "final String source;" lib/app_state.dart
          grep -q "Telegramdan zakas" lib/admin_ui.dart
          grep -q "Telegram buyurtmasi — botdan boshqariladi" lib/admin_ui.dart
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_state.dart lib/admin_ui.dart
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Separate app and Telegram order management"
          git push origin main

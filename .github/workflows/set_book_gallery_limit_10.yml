name: Optimize free-plan catalog sync

on:
  push:
    paths:
      - 'tools/optimize_free_plan_catalog_sync.py'
      - '.github/workflows/set_book_gallery_limit_10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply free-plan optimization
        run: python3 tools/optimize_free_plan_catalog_sync.py
      - name: Format
        run: dart format lib/app_state.dart
      - name: Packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify delta sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('lib/app_state.dart').read_text(encoding='utf-8')
          assert "customer_catalog_delta" in a
          assert "Duration(minutes: 2)" in a
          assert "loadCatalogCursor" in a
          assert "saveCatalogCursor" in a
          assert "deleted_ids" in a
          assert "upserts" in a
          assert "!const {'shipping', 'done', 'cancelled'}.contains(o.status)" in a
          print('Delta catalog sync and active-order polling optimization verified')
          PY
      - name: Commit runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app_state.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Reduce customer Supabase traffic with delta sync'
          git push origin main

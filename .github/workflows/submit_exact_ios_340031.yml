name: Submit owner-tested iOS 2.5.26 340031
on:
  push:
    branches: ['release/final-store-20261105']
    paths: ['.github/workflows/submit_exact_ios_340031.yml']
permissions:
  contents: read
concurrency:
  group: ios-final-340031
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby -c .github/release_tools/submit_exact_340031.rb
      - name: Submit exact existing tested build and release after Apple approval
        env:
          OWNER_APPROVED_PUBLIC_RELEASE: '2.5.26(340031)'
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: ruby .github/release_tools/submit_exact_340031.rb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-final-submission-340031
          path: ${{ runner.temp }}/ios-final-submission.json

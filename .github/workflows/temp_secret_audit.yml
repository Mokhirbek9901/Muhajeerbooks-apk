name: Temporary redacted secret audit

on:
  push:
    paths:
      - '.github/workflows/temp_secret_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and git history without printing secret values
        shell: bash
        run: |
          python - <<'PY'
          import math, re, subprocess
          from pathlib import Path
          from collections import Counter

          def entropy(s):
              if not s:
                  return 0.0
              c = Counter(s)
              n = len(s)
              return -sum((v/n) * math.log2(v/n) for v in c.values())

          critical = [
              ('SUPABASE_SECRET', re.compile(r'\bsb_secret_[A-Za-z0-9_\-]{16,}\b')),
              ('LEGACY_SERVICE_ROLE_HINT', re.compile(r'(?i)service[_\- ]?role.{0,20}[=:].{0,5}[\'\"]([A-Za-z0-9_\-.]{30,})')),
              ('GITHUB_TOKEN', re.compile(r'\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}\b|\bgithub_pat_[A-Za-z0-9_]{30,}\b')),
              ('GITLAB_TOKEN', re.compile(r'\bglpat-[A-Za-z0-9_\-]{20,}\b')),
              ('SLACK_TOKEN', re.compile(r'\bxox[baprs]-[A-Za-z0-9\-]{20,}\b')),
              ('AWS_ACCESS_KEY', re.compile(r'\bAKIA[0-9A-Z]{16}\b')),
              ('GOOGLE_API_KEY', re.compile(r'\bAIza[0-9A-Za-z_\-]{30,}\b')),
              ('STRIPE_SECRET', re.compile(r'\bsk_(?:live|test)_[A-Za-z0-9]{20,}\b')),
              ('TELEGRAM_BOT_TOKEN', re.compile(r'\b\d{6,12}:[A-Za-z0-9_\-]{30,}\b')),
              ('PRIVATE_KEY', re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
          ]
          public = [
              ('SUPABASE_PUBLISHABLE', re.compile(r'\bsb_publishable_[A-Za-z0-9_\-]{16,}\b')),
              ('LEGACY_SUPABASE_ANON_JWT', re.compile(r'\beyJ[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}\b')),
          ]
          generic_assign = re.compile(
              r'(?i)\b([A-Za-z_][A-Za-z0-9_]*(?:secret|token|api[_\-]?key|credential|auth)[A-Za-z0-9_]*)\b\s*(?:=|:|:=|=>)\s*[\'\"]([^\'\"\n]{18,220})[\'\"]'
          )

          def classify(line):
              out=[]
              if '${{ secrets.' in line or 'String.fromEnvironment' in line:
                  return out
              for name, rx in critical:
                  m=rx.search(line)
                  if m:
                      val=m.group(1) if m.lastindex else m.group(0)
                      out.append((name, len(val), None))
              for name, rx in public:
                  m=rx.search(line)
                  if m:
                      out.append((name, len(m.group(0)), None))
              for m in generic_assign.finditer(line):
                  var, val=m.group(1),m.group(2)
                  if val.startswith(('http://','https://')):
                      continue
                  if len(val) >= 20 and entropy(val) >= 3.5:
                      out.append(('GENERIC_HIGH_ENTROPY', len(val), var))
              return out

          findings=[]
          tracked = subprocess.check_output(['git','ls-files','-z']).decode('utf-8','ignore').split('\0')
          for f in tracked:
              if not f:
                  continue
              p=Path(f)
              try:
                  data=p.read_bytes()
                  if b'\x00' in data[:4096]:
                      continue
                  text=data.decode('utf-8')
              except Exception:
                  continue
              for i,line in enumerate(text.splitlines(),1):
                  for typ,length,var in classify(line):
                      findings.append(('CURRENT', f, i, typ, length, var or '-'))

          # Full history, only added lines; values are never printed.
          proc=subprocess.Popen(['git','log','--all','--full-history','-p','--no-color','--format=COMMIT:%H'],stdout=subprocess.PIPE,text=True,errors='ignore')
          commit='?'; path='?'; line_no=0
          for raw in proc.stdout:
              line=raw.rstrip('\n')
              if line.startswith('COMMIT:'):
                  commit=line[7:19]; path='?'; continue
              if line.startswith('diff --git a/'):
                  parts=line.split(' b/',1)
                  path=parts[1] if len(parts)>1 else '?'; continue
              if line.startswith('+++') or not line.startswith('+'):
                  continue
              content=line[1:]
              for typ,length,var in classify(content):
                  findings.append((f'HISTORY:{commit}', path, 0, typ, length, var or '-'))
          proc.wait()

          # Deduplicate and print redacted summary only.
          uniq=[]; seen=set()
          for row in findings:
              key=(row[0],row[1],row[3],row[4],row[5])
              if key not in seen:
                  seen.add(key); uniq.append(row)

          print('=== REDACTED SECRET AUDIT ===')
          print(f'Unique findings: {len(uniq)}')
          for scope,path,line,typ,length,var in uniq:
              loc=f'{path}:{line}' if line else path
              print(f'{scope} | {typ} | {loc} | variable={var} | value_length={length}')
          print('=== END AUDIT ===')
          PY

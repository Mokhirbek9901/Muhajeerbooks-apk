name: Distribute existing TestFlight build

on:
  workflow_dispatch:
    inputs:
      source_build:
        description: Existing TestFlight build whose tester access should be copied
        required: true
        default: '1009'
      target_build:
        description: New TestFlight build to distribute
        required: true
        default: '1014'
  push:
    branches: [main]
    paths:
      - '.github/testflight-distribute-trigger*'

permissions:
  contents: write

jobs:
  distribute:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare App Store Connect authentication
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          for name in ('APP_STORE_CONNECT_KEY_ID','APP_STORE_CONNECT_ISSUER_ID','APP_STORE_CONNECT_PRIVATE_KEY'):
              if not os.environ.get(name,'').strip():
                  raise SystemExit(f'Missing secret: {name}')
          key_id=os.environ['APP_STORE_CONNECT_KEY_ID'].strip()
          key=os.environ['APP_STORE_CONNECT_PRIVATE_KEY'].strip().replace('\\n','\n')+'\n'
          d=Path.home()/'.appstoreconnect/private_keys'
          d.mkdir(parents=True,exist_ok=True)
          p=d/f'AuthKey_{key_id}.p8'
          p.write_text(key)
          p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'ASC_PRIVATE_KEY_PATH={p}\n')
          PY

      - name: Copy TestFlight tester access to new build
        id: distribute
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SOURCE_BUILD: ${{ github.event.inputs.source_build || '1009' }}
          TARGET_BUILD: ${{ github.event.inputs.target_build || '1014' }}
        run: ruby .github/scripts/testflight_distribute.rb

      - name: Record verified distribution status
        if: always()
        env:
          DIST_OUTCOME: ${{ steps.distribute.outcome }}
          SOURCE_BUILD: ${{ github.event.inputs.source_build || '1009' }}
          TARGET_BUILD: ${{ github.event.inputs.target_build || '1014' }}
        run: |
          set -euo pipefail
          cat > .github/testflight-distribution-status.txt <<EOF
          outcome=$DIST_OUTCOME
          source=$SOURCE_BUILD
          target=$TARGET_BUILD
          run_id=$GITHUB_RUN_ID
          run_number=$GITHUB_RUN_NUMBER
          sha=$GITHUB_SHA
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/testflight-distribution-status.txt
          if git diff --cached --quiet; then
            echo "Status unchanged"
          else
            git commit -m "Record TestFlight distribution status [skip ci]"
            git push
          fi

      - name: Fail workflow if tester distribution failed
        if: steps.distribute.outcome != 'success'
        run: exit 1

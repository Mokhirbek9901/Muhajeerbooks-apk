name: One-time TestFlight Partial Preorder Shipping Fix 2.5.34

on:
  push:
    branches:
      - 'testflight/partial-preorder-shipping-fix-20261107'
    paths:
      - '.github/testflight_partial_preorder_shipping_20261107.trigger'

permissions:
  actions: read
  contents: read

concurrency:
  group: muhajeer-testflight-partial-postage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify only five approved partial-preorder files changed from TestFlight 440011
        run: |
          set -euo pipefail
          base=6a5af64d4ec18c6ed3727a521909470016278821
          git cat-file -e "$base^{commit}"
          actual=$(git diff --name-only "$base" HEAD | sort)
          expected=$(printf '%s\n' \
            '.github/testflight_partial_preorder_shipping_20261107.trigger' \
            '.github/workflows/testflight_partial_preorder_shipping_20261107.yml' \
            'lib/admin_preorder_partial.dart' \
            'test/preorder_partial_found_flow_test.dart' \
            'supabase/migrations/20261107233000_preorder_partial_ambiguous_x_fix.sql' | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'Unexpected changed files:\n%s\n' "$actual"
            exit 1
          fi

      - name: Validate and install Apple Distribution signing
        env:
          CSR_PRIVATE_KEY_PASSWORD: ${{ secrets.CSR_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ios/install_signing.sh

      - name: Preserve the verified encrypted CSR 4 key
        uses: actions/upload-artifact@v4
        with:
          name: muhajeer-csr4-encrypted-key
          path: ${{ runner.temp }}/signing/MuhajeerBooks-signing-key.zip
          if-no-files-found: error
          retention-days: 90

      - name: Prepare App Store Connect authentication
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          for name in ('APP_STORE_CONNECT_KEY_ID', 'APP_STORE_CONNECT_ISSUER_ID', 'APP_STORE_CONNECT_PRIVATE_KEY'):
              if not os.environ.get(name, '').strip():
                  raise SystemExit(f'Missing secret: {name}')
          key_id = os.environ['APP_STORE_CONNECT_KEY_ID'].strip()
          if not re.fullmatch(r'[A-Za-z0-9]+', key_id):
              raise SystemExit('Invalid App Store Connect key ID format.')
          key = os.environ['APP_STORE_CONNECT_PRIVATE_KEY'].strip().replace('\\n', '\n') + '\n'
          if not key.startswith('-----BEGIN PRIVATE KEY-----'):
              raise SystemExit('APP_STORE_CONNECT_PRIVATE_KEY must contain the original .p8 PEM contents.')
          directory = Path.home()/'.appstoreconnect/private_keys'
          directory.mkdir(parents=True, exist_ok=True)
          path = directory/f'AuthKey_{key_id}.p8'
          path.write_text(key)
          path.chmod(0o600)
          current_public = Path('.github/ios-marketing-version').read_text().strip()
          if current_public != '2.5.24':
              raise SystemExit(f'Unexpected published marketing baseline {current_public}; select a newer beta version explicitly.')
          # A new beta train. This is TestFlight-only; public and server versions stay unchanged.
          version = '2.5.34'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ASC_PRIVATE_KEY_PATH={path}\n')
              env.write(f'IOS_BUILD_NUMBER={450000 + 10*int(os.environ["GITHUB_RUN_NUMBER"]) + int(os.environ["GITHUB_RUN_ATTEMPT"])}\n')
              env.write(f'IOS_MARKETING_VERSION={version}\n')
          PY

      - name: Verify API access and App Store Connect app record
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ruby .github/scripts/ios/app_store_status.rb preflight

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate current web features and TestFlight preview
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/preorder_partial_found_flow_test.dart test/preorder_missing_book_rows_test.dart test/preorder_private_customer_stock_test.dart test/preorder_hidden_catalog_select_test.dart
          flutter test --dart-define=STORE_FEATURES=true --dart-define=APP_STORE_BUILD=true
          TZ=Asia/Seoul flutter test test/order_time_test.dart --dart-define=REQUIRE_KOREA_TIME=true

      - name: Install dependencies and configure manual signing
        run: |
          set -euo pipefail
          flutter pub get
          ruby .github/scripts/ios/configure_signing.rb
          cd ios
          pod install

      - name: Build signed iPhone and iPad IPA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-name="$IOS_MARKETING_VERSION" \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=APP_BUILD_NUMBER="$IOS_BUILD_NUMBER" \
            --dart-define=APP_STORE_BUILD=true \
            --dart-define=STORE_FEATURES=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --export-options-plist="$RUNNER_TEMP/signing/ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Verify exported IPA signature and device support
        run: python3 .github/scripts/ios/verify_ipa.py

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: muhajeer-books-ios-signed-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find build/ios/ipa -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/testflight-upload.log"

      - name: Verify uploaded build in TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ruby .github/scripts/ios/app_store_status.rb wait

      - name: Save release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-diagnostics
          path: |
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/testflight-upload.log
            ${{ runner.temp }}/testflight-result.json
            ${{ runner.temp }}/ipa-verification.json
            ${{ runner.temp }}/signing/metadata.json
          retention-days: 14

      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/ipa-verification"
          if [ -n "${ASC_PRIVATE_KEY_PATH:-}" ]; then rm -f "$ASC_PRIVATE_KEY_PATH"; fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi

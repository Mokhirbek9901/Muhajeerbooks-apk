name: UX and performance polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux_speed_polish.yml'
      - 'tools/ux_speed_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Apply UX and speed patch
        run: python3 tools/ux_speed_patch.py

      - name: Format
        run: dart format lib/admin_ui.dart lib/store_ui.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Web build
        run: flutter build web --release

      - name: Commit production polish and cleanup
        run: |
          rm .github/workflows/ux_speed_polish.yml tools/ux_speed_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin_ui.dart lib/store_ui.dart nginx.conf .github/workflows/ux_speed_polish.yml tools/ux_speed_patch.py
          git commit -m "Improve admin text editing and app performance"
          git push

name: UX and performance polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux_speed_polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Improve admin editing and app responsiveness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('lib/admin_ui.dart')
          s = admin.read_text(encoding='utf-8')

          if "import 'package:flutter/services.dart';" not in s:
              needle = "import 'package:flutter/material.dart';\n"
              assert needle in s
              s = s.replace(needle, needle + "import 'package:flutter/services.dart';\n", 1)

          old_field = """  Widget field(
    TextEditingController c,
    String label, {
    bool number = false,
    bool required = false,
    int lines = 1,
  }) => Padding(
    padding: const EdgeInsets.only(bottom: 11),
    child: TextFormField(
      controller: c,
      maxLines: lines,
      keyboardType: number ? TextInputType.number : TextInputType.text,
      decoration: InputDecoration(labelText: label),
      validator: required
          ? (v) => v == null || v.trim().isEmpty ? 'Majburiy' : null
          : null,
    ),
  );
"""
          new_field = """  Widget field(
    TextEditingController c,
    String label, {
    bool number = false,
    bool required = false,
    int lines = 1,
  }) => Padding(
    padding: const EdgeInsets.only(bottom: 11),
    child: TextFormField(
      controller: c,
      minLines: lines > 1 ? 4 : 1,
      maxLines: lines,
      keyboardType: number
          ? TextInputType.number
          : lines > 1
          ? TextInputType.multiline
          : TextInputType.text,
      textInputAction: number
          ? TextInputAction.next
          : lines > 1
          ? TextInputAction.newline
          : TextInputAction.next,
      enableSuggestions: !number,
      autocorrect: !number,
      decoration: InputDecoration(labelText: label),
      validator: required
          ? (v) => v == null || v.trim().isEmpty ? 'Majburiy' : null
          : null,
    ),
  );

  Future<void> _pasteDescription() async {
    final data = await Clipboard.getData(Clipboard.kTextPlain);
    final pasted = data?.text ?? '';
    if (pasted.isEmpty) return;

    final source = description.text;
    final selection = description.selection;
    final rawStart = selection.isValid ? selection.start : source.length;
    final rawEnd = selection.isValid ? selection.end : source.length;
    final start = rawStart.clamp(0, source.length).toInt();
    final end = rawEnd.clamp(start, source.length).toInt();
    final next = source.replaceRange(start, end, pasted);

    description.value = TextEditingValue(
      text: next,
      selection: TextSelection.collapsed(offset: start + pasted.length),
    );
    if (mounted) setState(() {});
  }

  Future<void> _copyDescription() async {
    final text = description.text;
    if (text.isEmpty) return;
    await Clipboard.setData(ClipboardData(text: text));
    if (!mounted) return;
    ScaffoldMessenger.of(context).showSnackBar(
      const SnackBar(content: Text('Tavsif nusxalandi ✅')),
    );
  }

  void _clearDescription() {
    description.clear();
    setState(() {});
  }

  Widget _descriptionEditor() => Padding(
    padding: const EdgeInsets.only(bottom: 11),
    child: Column(
      crossAxisAlignment: CrossAxisAlignment.start,
      children: [
        TextFormField(
          controller: description,
          minLines: 6,
          maxLines: 10,
          keyboardType: TextInputType.multiline,
          textInputAction: TextInputAction.newline,
          enableInteractiveSelection: true,
          enableSuggestions: true,
          autocorrect: true,
          decoration: const InputDecoration(
            labelText: 'Tavsif',
            alignLabelWithHint: true,
            hintText: 'Kitob haqida tavsifni yozing yoki pastdagi “Qo‘yish” tugmasidan foydalaning.',
          ),
        ),
        const SizedBox(height: 8),
        Wrap(
          spacing: 8,
          runSpacing: 8,
          children: [
            FilledButton.tonalIcon(
              onPressed: _pasteDescription,
              icon: const Icon(Icons.content_paste_rounded, size: 18),
              label: const Text('Qo‘yish'),
            ),
            OutlinedButton.icon(
              onPressed: description.text.isEmpty ? null : _copyDescription,
              icon: const Icon(Icons.copy_rounded, size: 18),
              label: const Text('Nusxa olish'),
            ),
            TextButton.icon(
              onPressed: description.text.isEmpty ? null : _clearDescription,
              icon: const Icon(Icons.backspace_outlined, size: 18),
              label: const Text('Tozalash'),
            ),
          ],
        ),
        const SizedBox(height: 5),
        const Text(
          '“Qo‘yish” clipboarddagi matnni aynan kursor turgan joyga qo‘shadi.',
          style: TextStyle(fontSize: 11.5, color: AppColors.muted),
        ),
      ],
    ),
  );
"""
          assert old_field in s, 'field block not found'
          s = s.replace(old_field, new_field, 1)

          old_desc = "            field(description, 'Tavsif', lines: 4),\n"
          assert old_desc in s, 'description field not found'
          s = s.replace(old_desc, "            _descriptionEditor(),\n", 1)

          old_desktop = "                    Expanded(child: pages[tab]),\n"
          assert old_desktop in s, 'desktop tab body not found'
          s = s.replace(
              old_desktop,
              "                    Expanded(\n                      child: IndexedStack(index: tab, children: pages),\n                    ),\n",
              1,
          )
          old_mobile = "              : pages[tab],\n"
          assert old_mobile in s, 'mobile tab body not found'
          s = s.replace(
              old_mobile,
              "              : IndexedStack(index: tab, children: pages),\n",
              1,
          )

          # Smaller uploads keep covers sharp on phones while reducing network/decode cost.
          s = s.replace(
              "        imageQuality: 85,\n        maxWidth: 1600,\n",
              "        imageQuality: 82,\n        maxWidth: 1200,\n",
              1,
          )

          admin.write_text(s, encoding='utf-8')

          store = Path('lib/store_ui.dart')
          t = store.read_text(encoding='utf-8')

          start = t.index('class _StoreShellState extends State<StoreShell>')
          end = t.index('class CategoriesPage', start)
          block = t[start:end]
          assert 'final state = context.watch<AppState>();' in block
          block = block.replace(
              'final state = context.watch<AppState>();',
              'final cartCount = context.select<AppState, int>((s) => s.cartCount);',
              1,
          )
          block = block.replace('    final pages = [', '    const pages = [', 1)
          block = block.replace('state.cartCount', 'cartCount')
          t = t[:start] + block + t[end:]

          card_start = t.index('class BookCard extends StatelessWidget')
          detail_start = t.index('class BookDetailPage', card_start)
          card = t[card_start:detail_start]
          old_watch = "    final state = context.watch<AppState>();\n    final favorite = state.isFavorite(book);\n"
          assert old_watch in card, 'BookCard watch block not found'
          card = card.replace(
              old_watch,
              "    final favorite = context.select<AppState, bool>(\n      (s) => s.isFavorite(book),\n    );\n    final state = context.read<AppState>();\n",
              1,
          )
          t = t[:card_start] + card + t[detail_start:]

          # Avoid expensive high-quality resampling while scrolling many covers.
          t = t.replace(
              "        fit: BoxFit.cover,\n        errorBuilder: (_, __, ___) => _placeholder(),\n",
              "        fit: BoxFit.cover,\n        filterQuality: FilterQuality.medium,\n        gaplessPlayback: true,\n        errorBuilder: (_, __, ___) => _placeholder(),\n",
              1,
          )

          store.write_text(t, encoding='utf-8')

          Path('nginx.conf').write_text("""server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  etag on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location ~* \\.(?:png|jpg|jpeg|gif|webp|svg|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location ~* \\.(?:js|css)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
""", encoding='utf-8')
          PY

      - name: Format
        run: dart format lib/admin_ui.dart lib/store_ui.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Web build
        run: flutter build web --release

      - name: Commit production polish and cleanup
        run: |
          rm .github/workflows/ux_speed_polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin_ui.dart lib/store_ui.dart nginx.conf .github/workflows/ux_speed_polish.yml
          git commit -m "Improve admin text editing and app performance"
          git push

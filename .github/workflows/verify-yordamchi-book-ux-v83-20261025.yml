name: Verify Yordamchi book UX v83
on:
  push:
    branches:
      - feature/yordamchi-book-filters-multi-entry-v83-20261025
  workflow_dispatch:
jobs:
  unit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript
        run: |
          node --check personal-assistant/app.js
          node --check personal-assistant/book-cost-list-ui.js
          node --check personal-assistant/sw.js
      - name: Run Yordamchi price and UX tests
        run: |
          node --test personal-assistant-tests/book-cost-filter-bulk-v83.test.cjs personal-assistant-tests/book-cost-som-kg-v82.test.cjs personal-assistant-tests/book-cost-simple-v81.test.cjs personal-assistant-tests/book-cost-actual-kg-v80.test.cjs personal-assistant-tests/book-cost-separation-v78.test.cjs

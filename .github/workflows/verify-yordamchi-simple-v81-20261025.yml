name: Verify Yordamchi simple book v81
on:
  push:
    branches:
      - feature/yordamchi-simple-book-cost-v81-20261025
  workflow_dispatch:
jobs:
  simple-book-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax validation
        run: |
          node --check personal-assistant/app.js
          node --check personal-assistant/book-costs.js
          node --check personal-assistant/sw.js
      - name: Run focused tests
        run: |
          node --test personal-assistant-tests/book-cost-simple-v81.test.cjs personal-assistant-tests/book-cost-separation-v78.test.cjs personal-assistant-tests/book-cost-actual-kg-v80.test.cjs

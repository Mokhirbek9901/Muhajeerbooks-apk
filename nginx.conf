server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 12m;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  etag on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # AI story generator: API key faqat serverda qoladi.
  location = /api/ai-story-background {
    proxy_pass http://127.0.0.1:8090/api/ai-story-background;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~ ^/api/(ai-assistant|ai-search)$ {
    proxy_pass http://127.0.0.1:8090$request_uri;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /api/health {
    proxy_pass http://127.0.0.1:8090/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }

  # Kitob ulashish havolasi uchun crawler-friendly Open Graph preview.
  # Edge Function faqat public kitob maydonlarini qaytaradi va keyin ilovaga yo‘naltiradi.
  location ^~ /share/ {
    rewrite ^/share/(.+)$ /functions/v1/book-share-preview?id=$1 break;
    proxy_pass https://rytfhjvhjxnbhgitowho.supabase.co;
    proxy_http_version 1.1;
    proxy_set_header Host rytfhjvhjxnbhgitowho.supabase.co;
    proxy_ssl_server_name on;
    proxy_ssl_name rytfhjvhjxnbhgitowho.supabase.co;
    proxy_read_timeout 30s;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Safari avtomatik so‘raydigan standart icon nomlari 404 qaytarmasin.
  location = /apple-touch-icon.png {
    try_files /icons/Icon-192.png =404;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /apple-touch-icon-precomposed.png {
    try_files /icons/Icon-192.png =404;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Flutter web uchun Supabase same-origin proxy.
  # REST/RPC, Edge Functions, Storage va Realtime bir xil Railway domenidan o'tadi.
  location /supabase/ {
    proxy_pass https://rytfhjvhjxnbhgitowho.supabase.co/;
    proxy_http_version 1.1;
    proxy_set_header Host rytfhjvhjxnbhgitowho.supabase.co;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_ssl_server_name on;
    proxy_ssl_name rytfhjvhjxnbhgitowho.supabase.co;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Mijozlarga yuboriladigan qisqa o'rnatish havolasi: /install
  location = /install {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files /install.html =404;
  }

  location = /install.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  # HTML har safar tekshiriladi, shunda yangi deploy tez ko‘rinadi.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Bootstrap/service-worker yangi versiyani tekshiradi, lekin ETag tufayli
  # o‘zgarmagan fayl qayta to‘liq yuklanmaydi.
  location = /flutter_bootstrap.js {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  location = /main.dart.js {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|otf)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|json|frag)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri/ /index.html;
  }
}

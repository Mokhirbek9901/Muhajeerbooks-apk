server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  etag off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Flutter web uchun Supabase same-origin proxy.
  # REST/RPC, Edge Functions, Storage va Realtime bir xil Railway domenidan o'tadi.
  location /supabase/ {
    proxy_pass https://rytfhjvhjxnbhgitowho.supabase.co/;
    proxy_http_version 1.1;
    proxy_set_header Host rytfhjvhjxnbhgitowho.supabase.co;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_ssl_server_name on;
    proxy_ssl_name rytfhjvhjxnbhgitowho.supabase.co;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
  }

  # Flutter web yangilanganda iPhone/Safari eski JS yoki service worker'ni ushlab
  # qolmasin. Muhim runtime fayllari har safar serverdan tekshiriladi.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /main.dart.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:js|css)$ {
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 12m;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  etag on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/wasm application/xml image/svg+xml;

  # Flutter web uchun Supabase same-origin proxy.
  # REST/RPC, Edge Functions, Storage va Realtime bir xil Railway domenidan o'tadi.
  location /supabase/ {
    proxy_pass https://rytfhjvhjxnbhgitowho.supabase.co/;
    proxy_http_version 1.1;
    proxy_set_header Host rytfhjvhjxnbhgitowho.supabase.co;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_ssl_server_name on;
    proxy_ssl_name rytfhjvhjxnbhgitowho.supabase.co;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
  }

  # HTML har safar tekshiriladi, shunda yangi deploy tez ko‘rinadi.
  # credentialless + same-origin Flutter Wasm'ga Android Chrome'da
  # multithreaded SkWasm rendereridan foydalanish imkonini beradi.
  location = /index.html {
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Bootstrap/service-worker yangi versiyani tekshiradi, lekin ETag tufayli
  # o‘zgarmagan fayl qayta to‘liq yuklanmaydi.
  location = /flutter_bootstrap.js {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location = /main.dart.js {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location = /main.dart.wasm {
    default_type application/wasm;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|otf)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:js|css|json|frag|wasm)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}

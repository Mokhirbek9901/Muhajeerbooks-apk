  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // iOS Safari draws its own cached history snapshot while the user swipes
    // from the left edge. Flutter Web canvases can appear blank/white in that
    // snapshot. While Flutter has a route to pop, claim only the tiny left-edge
    // gesture area and dispatch an app-level back request instead. Normal page
    // scrolling and touches outside the edge remain untouched.
    (() => {
      const EDGE_WIDTH = 28;
      const TRIGGER_DISTANCE = 58;
      const HORIZONTAL_BIAS = 1.15;
      let active = false;
      let fired = false;
      let startX = 0;
      let startY = 0;
      let lastX = 0;
      let lastY = 0;

      const canPop = () =>
        document.documentElement.getAttribute('data-muhajeer-can-pop') === '1';

      const reset = () => {
        active = false;
        fired = false;
        startX = 0;
        startY = 0;
        lastX = 0;
        lastY = 0;
      };

      const maybeFire = () => {
        if (!active || fired) return;
        const dx = lastX - startX;
        const dy = Math.abs(lastY - startY);
        if (dx >= TRIGGER_DISTANCE && dx > dy * HORIZONTAL_BIAS) {
          fired = true;
          window.dispatchEvent(new CustomEvent('muhajeer-swipe-back'));
        }
      };

      window.addEventListener('touchstart', (event) => {
        if (!canPop() || event.touches.length !== 1) return;
        const touch = event.touches[0];
        if (touch.clientX > EDGE_WIDTH) return;

        active = true;
        fired = false;
        startX = lastX = touch.clientX;
        startY = lastY = touch.clientY;

        // On iOS this prevents Safari from starting its native back/forward
        // snapshot gesture. The event still propagates to Flutter.
        event.preventDefault();
      }, { passive: false, capture: true });

      window.addEventListener('touchmove', (event) => {
        if (!active || event.touches.length !== 1) return;
        const touch = event.touches[0];
        lastX = touch.clientX;
        lastY = touch.clientY;
        event.preventDefault();
        maybeFire();
      }, { passive: false, capture: true });

      window.addEventListener('touchend', (event) => {
        if (!active) return;
        if (event.changedTouches.length > 0) {
          const touch = event.changedTouches[0];
          lastX = touch.clientX;
          lastY = touch.clientY;
        }
        event.preventDefault();
        maybeFire();
        reset();
      }, { passive: false, capture: true });

      window.addEventListener('touchcancel', () => {
        reset();
      }, { capture: true });
    })();
  </script>
  <script>
    // Eski Flutter cache workerlarini olib tashlaymiz, lekin Muhajeer Push
    // workerini saqlaymiz. Push worker ilova yopiq paytda ham xabarni ko‘rsatadi.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => {
            const url = reg.active?.scriptURL || reg.waiting?.scriptURL || reg.installing?.scriptURL || '';
            return url.endsWith('/push-sw.js') ? Promise.resolve(true) : reg.unregister();
          }));
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter((key) => key.startsWith('flutter-app-cache')).map((key) => caches.delete(key)));
          }
        } catch (_) {}
      });
    }

    (() => {
      const vapidPublicKey = 'BNmOtGaBLl4SW8Q_kRrbrTALuoDB5sOJbgCC-Z4bwy5yyAr4BncgXGh6OHP4ylmIyU4NMrsjHSIhWf0Eityf0fo';
      const publishableKey = 'sb_publishable_5lDr_sw4bu8g3x8LCVzp4g_sHSTMBiO';

      function base64UrlToUint8Array(value) {
        const padding = '='.repeat((4 - value.length % 4) % 4);
        const base64 = (value + padding).replace(/-/g, '+').replace(/_/g, '/');
        const raw = atob(base64);
        return Uint8Array.from([...raw].map((ch) => ch.charCodeAt(0)));
      }

      async function syncSubscription(subscription, phone = '') {
        const data = subscription.toJSON();
        if (!data.endpoint || !data.keys?.p256dh || !data.keys?.auth) return false;
        const response = await fetch('/supabase/functions/v1/customer-rpc', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': publishableKey,
            'Authorization': 'Bearer ' + publishableKey
          },
          body: JSON.stringify({
            name: 'customer_push_subscribe',
            params: {
              p_endpoint: data.endpoint,
              p_p256dh: data.keys.p256dh,
              p_auth: data.keys.auth,
              p_user_agent: navigator.userAgent || '',
              p_phone: (phone || '').toString().trim().slice(0, 40)
            }
          })
        });
        const result = await response.json().catch(() => ({}));
        return response.ok && result?.ok === true;
      }

      window.muhajeerPushSupported = () =>
        location.protocol === 'https:' &&
        'serviceWorker' in navigator &&
        'PushManager' in window &&
        'Notification' in window;

      window.muhajeerEnablePush = async (phone = '') => {
        try {
          if (!window.muhajeerPushSupported()) return false;
          const permission = Notification.permission === 'granted'
            ? 'granted'
            : await Notification.requestPermission();
          if (permission !== 'granted') return false;

          const registration = await navigator.serviceWorker.register('/push-sw.js', { scope: '/' });
          await navigator.serviceWorker.ready;
          let subscription = await registration.pushManager.getSubscription();
          if (!subscription) {
            subscription = await registration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: base64UrlToUint8Array(vapidPublicKey)
            });
          }
          return await syncSubscription(subscription, phone);
        } catch (error) {
          console.warn('Muhajeer push setup failed', error);
          return false;
        }
      };

      // Ruxsat avval berilgan bo‘lsa, endpoint yangilangan bo‘lishi mumkin:
      // foydalanuvchini qayta bezovta qilmasdan bazaga qayta sinxronlaymiz.
      function savedCustomerPhone() {
        try {
          return localStorage.getItem('flutter.muhajeer_customer_phone') ||
                 localStorage.getItem('muhajeer_customer_phone') || '';
        } catch (_) {
          return '';
        }
      }

      window.muhajeerSyncPushPhone = async (phone = '') => {
        try {
          if (!window.muhajeerPushSupported() || Notification.permission !== 'granted') return false;
          const registration = await navigator.serviceWorker.register('/push-sw.js', { scope: '/' });
          await navigator.serviceWorker.ready;
          const subscription = await registration.pushManager.getSubscription();
          if (!subscription) return false;
          return await syncSubscription(subscription, phone || savedCustomerPhone());
        } catch (_) {
          return false;
        }
      };

      window.addEventListener('load', () => {
        if (window.muhajeerPushSupported() && Notification.permission === 'granted') {
          window.muhajeerEnablePush(savedCustomerPhone());
        }
      });

      // Brauzer/telefon xavfsizlik qoidalari bildirishnomani foydalanuvchi
      // roziligisiz yoqishga ruxsat bermaydi. Shuning uchun hali tanlov qilinmagan
      // qurilmada ilovadagi birinchi tabiiy bosishda tizim ruxsat oynasini
      // avtomatik chiqaramiz. "Allow" berilgach obuna darhol yaratiladi.
      const autoAskPushOnFirstInteraction = async () => {
        if (!window.muhajeerPushSupported()) return;
        if (Notification.permission !== 'default') return;
        await window.muhajeerEnablePush(savedCustomerPhone());
      };
      window.addEventListener('pointerdown', autoAskPushOnFirstInteraction, {
        once: true,
        passive: true
      });
      window.addEventListener('keydown', autoAskPushOnFirstInteraction, {
        once: true
      });
    })();
  </script>
  <script>
    // Home-screen web app uzoq vaqt ochiq qolsa iOS eski Flutter bundle'ni
    // xotirada ushlab turishi mumkin. Serverdagi main.dart.js o‘zgarganini
    // app qayta foregroundga kelganda tekshirib, yangi versiyani avtomatik
    // yuklaymiz. Bu foydalanuvchi cache tozalashiga ehtiyoj qoldirmaydi.
    (() => {
      const key = 'muhajeer-main-etag-v1';
      let checking = false;

      async function checkForUpdate() {
        if (checking) return;
        checking = true;
        try {
          const response = await fetch('/main.dart.js', {
            method: 'HEAD',
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache' }
          });
          const tag = response.headers.get('etag') ||
              response.headers.get('last-modified');
          if (!tag) return;

          const previous = localStorage.getItem(key);
          localStorage.setItem(key, tag);
          if (previous && previous !== tag) {
            location.reload();
          }
        } catch (_) {
          // Offline/vaqtinchalik tarmoq xatosida ilova ishlashda davom etadi.
        } finally {
          checking = false;
        }
      }

      window.addEventListener('load', checkForUpdate);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkForUpdate();
      });
      window.addEventListener('focus', checkForUpdate);
      setInterval(checkForUpdate, 60000);
    })();
  </script>

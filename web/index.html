  <script>
    // Old Flutter PWA cache caused iPhone/Safari to keep an outdated app after
    // a successful Railway deploy. This storefront now prefers the live build.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } catch (_) {
        // Cache cleanup must never block the shop.
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=20260909-1';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>

<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F3EA">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Muhajeer Books ilovasini telefon bosh ekraniga o‘rnating">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muhajeer Books">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/Icon-192.png">
  <link rel="canonical" href="https://muhajeer-books-live-production.up.railway.app/install">
  <title>Muhajeer Books — Install</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;color:#173834;background:#f7f3ea}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f7f3ea;padding:calc(20px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
    .card{width:min(100%,480px);background:#fff;border:1px solid #e8d8b7;border-radius:28px;padding:26px 22px;box-shadow:0 18px 48px rgba(28,56,51,.09)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}.icon{width:70px;height:70px;border-radius:20px;border:1px solid #e7d4ad;overflow:hidden;flex:0 0 70px}.icon img{width:100%;height:100%;object-fit:cover}.brand h1{font-size:25px;margin:0;line-height:1.05}.brand p{margin:6px 0 0;color:#746d61;font-size:14px;font-weight:650}
    h2{font-size:25px;line-height:1.2;margin:0 0 10px;text-align:center}.lead{font-size:15.5px;line-height:1.5;color:#60645f;text-align:center;margin:0 0 22px}
    .install{width:100%;border:0;border-radius:18px;padding:19px 18px;background:#0f6e65;color:#fff;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(15,110,101,.18)}.install:disabled{opacity:.6;cursor:default}
    .open{display:block;margin-top:11px;text-align:center;text-decoration:none;background:#edf5f2;color:#0f6e65;border-radius:16px;padding:13px 16px;font-weight:800}
    .status{margin-top:16px;padding:12px 13px;border-radius:15px;background:#edf7f3;color:#285b52;font-size:14px;line-height:1.45;text-align:center}.status.warn{background:#fff4e8;color:#7c4d17}.status.ok{background:#eaf8f1;color:#176a50;font-weight:800}
    .iosbox,.fallback{display:none;margin-top:16px;padding:17px;background:#fbf8f1;border:1px solid #eadfc8;border-radius:19px}.iosbox.show,.fallback.show{display:block}
    .box-title{font-size:18px;font-weight:900;text-align:center;margin-bottom:12px}.step{display:flex;gap:11px;align-items:flex-start;margin:12px 0;color:#434a46;font-size:15px;line-height:1.45}.num{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#dca83e;color:#173834;font-weight:900}
    .share-demo{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 14px;font-size:19px;font-weight:900;color:#173834}.share-icon{width:42px;height:42px;border:2px solid #173834;border-radius:10px;display:grid;place-items:center;font-size:22px}
    .copy{display:none;width:100%;margin-top:10px;border:0;border-radius:14px;padding:13px 14px;background:#173f3a;color:#fff;font-weight:850;font-size:14px}.copy.show{display:block}
    .langs{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:17px}.lang{border:0;background:transparent;color:#8a8378;padding:5px 7px;font-size:12px;font-weight:800;cursor:pointer}.lang.active{color:#0f6e65;text-decoration:underline;text-underline-offset:3px}
    .small{text-align:center;color:#989188;font-size:12px;margin:11px 0 0}
  </style>
</head>
<body>
<main class="card">
  <div class="brand">
    <div class="icon"><img src="/icons/Icon-192.png" alt="Muhajeer Books"></div>
    <div><h1>Muhajeer Books</h1><p id="tagline"></p></div>
  </div>

  <h2 id="title"></h2>
  <p class="lead" id="lead"></p>
  <button class="install" id="installBtn"></button>
  <a class="open" href="/" id="openBtn"></a>
  <div class="status" id="status"></div>

  <div class="iosbox" id="iosBox">
    <div class="box-title" id="iosTitle"></div>
    <div class="share-demo"><span class="share-icon">↑</span><span id="shareLabel"></span></div>
    <div class="step"><span class="num">1</span><span id="iosStep1"></span></div>
    <div class="step"><span class="num">2</span><span id="iosStep2"></span></div>
    <button class="copy" id="copyBtn"></button>
  </div>

  <div class="fallback" id="fallback">
    <div class="box-title" id="fallbackTitle"></div>
    <div class="step"><span class="num">1</span><span id="fallback1"></span></div>
    <div class="step"><span class="num">2</span><span id="fallback2"></span></div>
  </div>

  <div class="langs">
    <button class="lang" data-lang="uz">O‘zbekcha</button>
    <button class="lang" data-lang="ru">Русский</button>
    <button class="lang" data-lang="en">English</button>
    <button class="lang" data-lang="ko">한국어</button>
  </div>
  <p class="small" id="small"></p>
</main>

<script>
(() => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/flutter_service_worker.js').catch(()=>{});

  const txt = {
    uz:{tag:"Koreyadagi o‘zbek kitob do‘koni",title:"Muhajeer Books’ni o‘rnating",lead:"Bitta link. Telefoningiz iPhone yoki Android ekanini o‘zi aniqlaydi.",install:"📲 O‘RNATISH",iosInstall:" iPHONE’GA QO‘SHISH",open:"Hozir ilovani ochish",prep:"O‘rnatish tayyorlanmoqda…",ready:"Tayyor — O‘RNATISH tugmasini bosing.",installed:"Muhajeer Books allaqachon o‘rnatilgan ✅",installedBtn:"✅ O‘RNATILGAN — OCHISH",iosReady:"iPhone’da tugmani bosing — 2 ta juda oson qadam chiqadi.",iosTitle:"iPhone’da faqat 2 qadam",share:"Safari’dagi Share tugmasi",ios1:"Pastdagi <b>□↑ Share / Ulashish</b> tugmasini bosing.",ios2:"<b>Add to Home Screen / 홈 화면에 추가 / На экран «Домой»</b> ni bosing, keyin <b>Add</b> ni bosing.",iosInApp:"Link Telegram/Instagram ichida ochilgan. Avval Safari’da oching.",copy:"🔗 Linkni nusxalash",copied:"Link nusxalandi ✅ Safari’ga qo‘yib oching.",fallbackTitle:"Agar o‘rnatish oynasi chiqmasa",fb1:"Chrome menyusidagi <b>⋮</b> ni bosing.",fb2:"<b>Install app / Add to Home screen</b> ni tanlang.",small:"Til ham avtomatik aniqlanadi."},
    ru:{tag:"Узбекский книжный магазин в Корее",title:"Установите Muhajeer Books",lead:"Одна ссылка. Телефон iPhone или Android определяется автоматически.",install:"📲 УСТАНОВИТЬ",iosInstall:" ДОБАВИТЬ НА iPHONE",open:"Открыть приложение",prep:"Подготовка установки…",ready:"Готово — нажмите УСТАНОВИТЬ.",installed:"Muhajeer Books уже установлен ✅",installedBtn:"✅ УСТАНОВЛЕНО — ОТКРЫТЬ",iosReady:"На iPhone нажмите кнопку — появятся 2 простых шага.",iosTitle:"На iPhone всего 2 шага",share:"Кнопка Share в Safari",ios1:"Нажмите внизу <b>□↑ Поделиться / Share</b>.",ios2:"Нажмите <b>На экран «Домой» / Add to Home Screen / 홈 화면에 추가</b>, затем <b>Добавить</b>.",iosInApp:"Ссылка открыта внутри Telegram/Instagram. Сначала откройте её в Safari.",copy:"🔗 Скопировать ссылку",copied:"Ссылка скопирована ✅ Откройте её в Safari.",fallbackTitle:"Если окно установки не появилось",fb1:"Откройте меню Chrome <b>⋮</b>.",fb2:"Выберите <b>Установить приложение / Добавить на главный экран</b>.",small:"Язык также определяется автоматически."},
    en:{tag:"Uzbek bookstore in Korea",title:"Install Muhajeer Books",lead:"One link. It automatically detects iPhone or Android.",install:"📲 INSTALL",iosInstall:" ADD TO iPHONE",open:"Open app now",prep:"Preparing install…",ready:"Ready — tap INSTALL.",installed:"Muhajeer Books is already installed ✅",installedBtn:"✅ INSTALLED — OPEN",iosReady:"On iPhone, tap the button for 2 very easy steps.",iosTitle:"Only 2 steps on iPhone",share:"Safari Share button",ios1:"Tap <b>□↑ Share</b> at the bottom.",ios2:"Tap <b>Add to Home Screen</b>, then tap <b>Add</b>.",iosInApp:"This link is open inside Telegram/Instagram. Open it in Safari first.",copy:"🔗 Copy link",copied:"Link copied ✅ Paste it into Safari.",fallbackTitle:"If the install window does not appear",fb1:"Open Chrome menu <b>⋮</b>.",fb2:"Choose <b>Install app / Add to Home screen</b>.",small:"Language is detected automatically too."},
    ko:{tag:"한국의 우즈베크어 서점",title:"Muhajeer Books 설치",lead:"하나의 링크로 iPhone과 Android를 자동으로 구분합니다.",install:"📲 설치하기",iosInstall:" iPHONE에 추가",open:"지금 앱 열기",prep:"설치를 준비하고 있습니다…",ready:"준비 완료 — 설치하기를 누르세요.",installed:"Muhajeer Books가 이미 설치되어 있습니다 ✅",installedBtn:"✅ 설치됨 — 열기",iosReady:"iPhone에서는 버튼을 누르면 아주 쉬운 2단계가 나옵니다.",iosTitle:"iPhone은 2단계만 하면 됩니다",share:"Safari 공유 버튼",ios1:"아래의 <b>□↑ 공유</b> 버튼을 누르세요.",ios2:"<b>홈 화면에 추가</b>를 누른 뒤 <b>추가</b>를 누르세요.",iosInApp:"Telegram/Instagram 안에서 열린 링크입니다. 먼저 Safari에서 여세요.",copy:"🔗 링크 복사",copied:"링크가 복사되었습니다 ✅ Safari에 붙여넣어 여세요.",fallbackTitle:"설치 창이 뜨지 않으면",fb1:"Chrome 메뉴 <b>⋮</b>를 누르세요.",fb2:"<b>앱 설치 / 홈 화면에 추가</b>를 선택하세요.",small:"언어도 자동으로 감지됩니다."}
  };

  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isInApp = isIOS && /Telegram|Instagram|FBAN|FBAV|Line|NAVER|KAKAOTALK/i.test(ua);
  const lp = (navigator.language || 'uz').toLowerCase().slice(0,2);
  let lang = ['uz','ru','en','ko'].includes(lp) ? lp : 'uz';
  let deferredPrompt = null;

  const $ = id => document.getElementById(id);
  const btn = $('installBtn');
  const status = $('status');
  const iosBox = $('iosBox');
  const fallback = $('fallback');
  const copyBtn = $('copyBtn');

  function render(){
    const t = txt[lang];
    document.documentElement.lang = lang;
    $('tagline').textContent = t.tag;
    $('title').textContent = t.title;
    $('lead').textContent = t.lead;
    $('openBtn').textContent = t.open;
    $('small').textContent = t.small;
    $('iosTitle').textContent = t.iosTitle;
    $('shareLabel').textContent = t.share;
    $('iosStep1').innerHTML = t.ios1;
    $('iosStep2').innerHTML = t.ios2;
    $('fallbackTitle').textContent = t.fallbackTitle;
    $('fallback1').innerHTML = t.fb1;
    $('fallback2').innerHTML = t.fb2;
    copyBtn.textContent = t.copy;
    document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));

    iosBox.classList.remove('show');
    fallback.classList.remove('show');
    copyBtn.classList.toggle('show', isInApp);
    status.className = 'status';

    if(isStandalone){
      btn.textContent = t.installedBtn;
      status.className = 'status ok';
      status.textContent = t.installed;
      return;
    }

    if(isIOS){
      btn.textContent = t.iosInstall;
      status.textContent = isInApp ? t.iosInApp : t.iosReady;
      return;
    }

    btn.textContent = t.install;
    status.textContent = deferredPrompt ? t.ready : t.prep;
  }

  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    deferredPrompt = e;
    render();
  });

  window.addEventListener('appinstalled', ()=>{
    deferredPrompt = null;
    render();
  });

  btn.addEventListener('click', async()=>{
    const t = txt[lang];
    if(isStandalone){ location.replace('/'); return; }

    if(isIOS){
      iosBox.classList.add('show');
      status.className = isInApp ? 'status warn' : 'status';
      status.textContent = isInApp ? t.iosInApp : t.iosReady;
      iosBox.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }

    if(deferredPrompt){
      const p = deferredPrompt;
      deferredPrompt = null;
      await p.prompt();
      const choice = await p.userChoice.catch(()=>null);
      if(!choice || choice.outcome !== 'accepted'){
        fallback.classList.add('show');
        status.className = 'status warn';
        status.textContent = t.fallbackTitle;
      }
      return;
    }

    fallback.classList.add('show');
    status.className = 'status warn';
    status.textContent = t.fallbackTitle;
    fallback.scrollIntoView({behavior:'smooth',block:'center'});
  });

  copyBtn.addEventListener('click', async()=>{
    const t = txt[lang];
    try{
      await navigator.clipboard.writeText(location.origin + '/install');
      status.className = 'status ok';
      status.textContent = t.copied;
    }catch(_){
      const ta = document.createElement('textarea');
      ta.value = location.origin + '/install';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      status.className = 'status ok';
      status.textContent = t.copied;
    }
  });

  document.querySelectorAll('.lang').forEach(x=>x.addEventListener('click',()=>{lang=x.dataset.lang;render();}));
  render();
  if(!isIOS) setTimeout(()=>{ if(!deferredPrompt && !isStandalone){ status.textContent=txt[lang].fallbackTitle; } },1800);
})();
</script>
</body>
</html>

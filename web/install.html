<!DOCTYPE html>
<html lang="uz">
<head>

  <meta name="theme-color" content="#F7F3EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Muhajeer Books">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/Icon-192.png">
  <title>Muhajeer Books — Install</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;color:#173834;background:#f7f3ea}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f3ea;padding:calc(20px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
    .card{width:min(100%,480px);background:#fff;border:1px solid #e8d8b7;border-radius:28px;padding:26px 22px;box-shadow:0 18px 48px rgba(28,56,51,.09)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.icon{width:68px;height:68px;border-radius:19px;border:1px solid #e7d4ad;overflow:hidden}.icon img{width:100%;height:100%;object-fit:cover}.brand h1{font-size:24px;margin:0}.brand p{margin:5px 0 0;color:#746d61;font-size:14px;font-weight:650}
    .device{text-align:center;font-size:13px;font-weight:850;color:#0f6e65;margin-bottom:12px}h2{text-align:center;font-size:24px;margin:0 0 8px}.lead{text-align:center;color:#60645f;font-size:15px;line-height:1.5;margin:0 0 20px}
    .install{width:100%;border:0;border-radius:18px;padding:19px;background:#0f6e65;color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(15,110,101,.18)}
    .open{display:block;margin-top:10px;text-align:center;text-decoration:none;background:#edf5f2;color:#0f6e65;border-radius:15px;padding:12px 14px;font-weight:800}
    .status{margin-top:14px;padding:12px;border-radius:14px;background:#edf7f3;color:#285b52;font-size:13.5px;line-height:1.45;text-align:center}.status.warn{background:#fff4e8;color:#7c4d17}.status.ok{background:#eaf8f1;color:#176a50;font-weight:800}
    .guide{display:none;margin-top:15px;border:1px solid #eadfc8;background:#fbf8f1;border-radius:18px;padding:15px}.guide.show{display:block}.guide h3{margin:0 0 10px;font-size:17px;text-align:center}.step{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px;line-height:1.45;color:#434a46}.n{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#dca83e;color:#173834;font-weight:900}.more{padding:2px 7px;border-radius:8px;background:#ece9e2;font-weight:900}
    .langs{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:17px}.lang{border:0;background:transparent;color:#8a8378;padding:5px 7px;font-size:12px;font-weight:800;cursor:pointer}.lang.active{color:#0f6e65;text-decoration:underline;text-underline-offset:3px}.small{text-align:center;color:#989188;font-size:12px;margin:11px 0 0}
  </style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="icon"><img src="/icons/Icon-192.png" alt="Muhajeer Books"></div><div><h1>Muhajeer Books</h1><p id="tag"></p></div></div>
  <div class="device" id="device"></div>
  <h2 id="title"></h2><p class="lead" id="lead"></p>
  <button class="install" id="installBtn"></button>
  <a class="open" href="/" id="openBtn"></a>
  <div class="status" id="status"></div>
  <section class="guide" id="guide"><h3 id="guideTitle"></h3><div id="steps"></div></section>
  <div class="langs"><button class="lang" data-lang="uz">O‘zbekcha</button><button class="lang" data-lang="ru">Русский</button><button class="lang" data-lang="en">English</button><button class="lang" data-lang="ko">한국어</button></div>
  <p class="small" id="small"></p>
</main>
<script>
(()=>{
 if('serviceWorker' in navigator) navigator.serviceWorker.register('/flutter_service_worker.js').catch(()=>{});
 const T={
  uz:{tag:"Koreyadagi o‘zbek kitob do‘koni",androidDevice:"🤖 Android telefon aniqlandi",iosDevice:" iPhone aniqlandi",androidTitle:"Android’ga o‘rnatish",iosTitle:"iPhone’ga o‘rnatish",androidLead:"Bitta tugmani bosing — o‘rnatish oynasi chiqadi.",iosLead:"Bitta tugmani bosing — iPhone’ning o‘z oynasini ochishga harakat qilamiz.",androidBtn:"📲 ANDROID’GA O‘RNATISH",iosBtn:" iPHONE’GA O‘RNATISH",open:"Hozir ilovani ochish",prep:"O‘rnatish tayyorlanmoqda…",ready:"Tayyor — tugmani bosing.",iosReady:"Tugmani bosing. Avval iPhone’ning ulashish oynasini ochishga harakat qilamiz.",installed:"Muhajeer Books allaqachon o‘rnatilgan ✅",installedBtn:"✅ O‘RNATILGAN — OCHISH",androidGuide:"Agar o‘rnatish oynasi chiqmasa",androidSteps:["Chrome menyusidagi <b>⋮</b> ni bosing.","<b>Install app / Add to Home screen</b> ni tanlang."],iosGuide:"Agar avtomatik oynada “Add to Home Screen” chiqmasa",iosSteps:["Ochilgan oynada <b>Add to Home Screen / 홈 화면에 추가 / На экран «Домой»</b> ni qidiring.","Ko‘rinmasa <span class='more'>더 보기 / More / Ещё</span> ni bosing.","Keyin <b>Add / 추가 / Добавить</b> ni bosing."],iosFallback:"Apple sabab sayt iPhone bosh ekraniga foydalanuvchi tasdig‘isiz o‘zini qo‘sha olmaydi. Eng yaqin yo‘l shu.",small:"Telefon va til avtomatik aniqlanadi."},
  ru:{tag:"Узбекский книжный магазин в Корее",androidDevice:"🤖 Обнаружен Android",iosDevice:" Обнаружен iPhone",androidTitle:"Установить на Android",iosTitle:"Установить на iPhone",androidLead:"Нажмите одну кнопку — откроется окно установки.",iosLead:"Нажмите одну кнопку — попробуем сразу открыть системное меню iPhone.",androidBtn:"📲 УСТАНОВИТЬ НА ANDROID",iosBtn:" УСТАНОВИТЬ НА iPHONE",open:"Открыть приложение",prep:"Подготовка установки…",ready:"Готово — нажмите кнопку.",iosReady:"Нажмите кнопку. Сначала попробуем открыть системное меню iPhone.",installed:"Muhajeer Books уже установлен ✅",installedBtn:"✅ УСТАНОВЛЕНО — ОТКРЫТЬ",androidGuide:"Если окно установки не появилось",androidSteps:["Откройте меню Chrome <b>⋮</b>.","Выберите <b>Установить приложение / Добавить на главный экран</b>."],iosGuide:"Если Add to Home Screen не видно",iosSteps:["В открывшемся меню найдите <b>На экран «Домой» / Add to Home Screen / 홈 화면에 추가</b>.","Если пункта нет, нажмите <span class='more'>Ещё / More / 더 보기</span>.","Затем нажмите <b>Добавить / Add / 추가</b>."],iosFallback:"Apple не разрешает сайту добавить себя на главный экран без подтверждения пользователя. Это самый короткий вариант.",small:"Телефон и язык определяются автоматически."},
  en:{tag:"Uzbek bookstore in Korea",androidDevice:"🤖 Android detected",iosDevice:" iPhone detected",androidTitle:"Install on Android",iosTitle:"Install on iPhone",androidLead:"Tap one button — the install window will appear.",iosLead:"Tap one button — we’ll try to open the iPhone system sheet immediately.",androidBtn:"📲 INSTALL ON ANDROID",iosBtn:" INSTALL ON iPHONE",open:"Open app now",prep:"Preparing install…",ready:"Ready — tap the button.",iosReady:"Tap the button. We’ll try to open the iPhone system sheet first.",installed:"Muhajeer Books is already installed ✅",installedBtn:"✅ INSTALLED — OPEN",androidGuide:"If the install window does not appear",androidSteps:["Open Chrome menu <b>⋮</b>.","Choose <b>Install app / Add to Home screen</b>."],iosGuide:"If Add to Home Screen is not visible",iosSteps:["In the opened sheet, look for <b>Add to Home Screen</b>.","If needed tap <span class='more'>More / 더 보기 / Ещё</span>.","Then tap <b>Add</b>."],iosFallback:"Apple does not allow a website to add itself to the Home Screen without user confirmation. This is the shortest available route.",small:"Phone and language are detected automatically."},
  ko:{tag:"한국의 우즈베크어 서점",androidDevice:"🤖 Android가 감지되었습니다",iosDevice:" iPhone이 감지되었습니다",androidTitle:"Android에 설치",iosTitle:"iPhone에 설치",androidLead:"버튼 한 번만 누르면 설치 창이 열립니다.",iosLead:"버튼 한 번만 누르면 iPhone 시스템 창을 바로 열어보겠습니다.",androidBtn:"📲 ANDROID에 설치",iosBtn:" iPHONE에 설치",open:"지금 앱 열기",prep:"설치를 준비하고 있습니다…",ready:"준비 완료 — 버튼을 누르세요.",iosReady:"버튼을 누르세요. iPhone 시스템 창을 먼저 열어보겠습니다.",installed:"Muhajeer Books가 이미 설치되어 있습니다 ✅",installedBtn:"✅ 설치됨 — 열기",androidGuide:"설치 창이 뜨지 않으면",androidSteps:["Chrome 메뉴 <b>⋮</b>를 누르세요.","<b>앱 설치 / 홈 화면에 추가</b>를 선택하세요."],iosGuide:"홈 화면에 추가가 안 보이면",iosSteps:["열린 창에서 <b>홈 화면에 추가 / Add to Home Screen</b>를 찾으세요.","안 보이면 <span class='more'>더 보기 / More / Ещё</span>를 누르세요.","그다음 <b>추가</b>를 누르세요."],iosFallback:"Apple 정책상 사용자 확인 없이 웹사이트가 스스로 홈 화면에 추가될 수 없습니다. 이 방법이 가장 짧습니다.",small:"휴대폰과 언어가 자동으로 감지됩니다."}
 };
 const ua=navigator.userAgent||'';
 const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const lp=(navigator.language||'uz').toLowerCase().slice(0,2);let lang=['uz','ru','en','ko'].includes(lp)?lp:'uz';let promptEvent=null;
 const $=x=>document.getElementById(x),btn=$('installBtn'),status=$('status'),guide=$('guide');
 const rows=a=>a.map((x,i)=>`<div class="step"><span class="n">${i+1}</span><span>${x}</span></div>`).join('');
 function render(){const t=T[lang];document.documentElement.lang=lang;$('tag').textContent=t.tag;$('device').textContent=isIOS?t.iosDevice:t.androidDevice;$('title').textContent=isIOS?t.iosTitle:t.androidTitle;$('lead').textContent=isIOS?t.iosLead:t.androidLead;$('openBtn').textContent=t.open;$('small').textContent=t.small;btn.textContent=standalone?t.installedBtn:(isIOS?t.iosBtn:t.androidBtn);status.className='status';guide.classList.remove('show');if(standalone){status.className='status ok';status.textContent=t.installed;return;}if(isIOS){status.textContent=t.iosReady;$('guideTitle').textContent=t.iosGuide;$('steps').innerHTML=rows(t.iosSteps);}else{status.textContent=promptEvent?t.ready:t.prep;$('guideTitle').textContent=t.androidGuide;$('steps').innerHTML=rows(t.androidSteps);}document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));}
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;render();});
 addEventListener('appinstalled',()=>{promptEvent=null;render();});
 document.querySelectorAll('.lang').forEach(x=>x.onclick=()=>{lang=x.dataset.lang;render();});
 btn.onclick=async()=>{const t=T[lang];if(standalone){location.href='/';return;}if(isIOS){let opened=false;try{if(navigator.share){opened=true;await navigator.share({title:'Muhajeer Books',text:'Muhajeer Books',url:location.origin+'/'});}}catch(_){opened=true;}guide.classList.add('show');status.className='status warn';status.textContent=t.iosFallback;guide.scrollIntoView({behavior:'smooth',block:'center'});return;}if(promptEvent){const p=promptEvent;promptEvent=null;await p.prompt();const c=await p.userChoice.catch(()=>null);if(!c||c.outcome!=='accepted'){guide.classList.add('show');guide.scrollIntoView({behavior:'smooth',block:'center'});}return;}guide.classList.add('show');guide.scrollIntoView({behavior:'smooth',block:'center'});};
 render();setTimeout(()=>{if(!isIOS&&!standalone&&!promptEvent)status.textContent=T[lang].androidGuide;},1800);
})();
</script>

</html>

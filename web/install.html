<!DOCTYPE html>

  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;color:#173834;background:#f7f3ea}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f7f3ea;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
    .card{width:min(100%,480px);background:#fff;border:1px solid #e8d8b7;border-radius:28px;padding:25px 22px;box-shadow:0 18px 48px rgba(28,56,51,.09)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.icon{width:68px;height:68px;border-radius:19px;border:1px solid #e7d4ad;overflow:hidden}.icon img{width:100%;height:100%;object-fit:cover}.brand h1{font-size:24px;margin:0}.brand p{margin:5px 0 0;color:#746d61;font-size:14px;font-weight:650}
    .device{text-align:center;font-size:13px;font-weight:900;color:#0f6e65;margin-bottom:10px}h2{text-align:center;font-size:25px;margin:0 0 8px}.lead{text-align:center;color:#5f655f;font-size:15px;line-height:1.5;margin:0 0 18px}

    .overlay{position:fixed;inset:0;z-index:9999;background:rgba(12,34,31,.76);display:none;align-items:flex-end;justify-content:center;padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}.overlay.show{display:flex}
    .sheet{width:min(100%,500px);background:#fff;border-radius:28px;padding:22px;box-shadow:0 18px 55px rgba(0,0,0,.28);position:relative}.sheet h3{font-size:22px;margin:0 38px 7px;text-align:center}.sheet>p{text-align:center;margin:0 0 14px;color:#656b66;line-height:1.45}.close{position:absolute;right:15px;top:14px;border:0;background:#eef1ef;width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:900}
    .important{background:#fff3d8;border:2px solid #e4b34f;color:#66480e;border-radius:16px;padding:12px 13px;text-align:center;font-size:14px;font-weight:900;margin:8px 0 13px}
    .step{display:flex;align-items:center;gap:12px;border:2px solid #d7e8e3;border-radius:17px;padding:12px 13px;margin:8px 0;background:#f9fcfb}.num{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dca83e;color:#173834;font-size:17px;font-weight:950}.glyph{font-size:27px;font-weight:950;color:#0f6e65;min-width:42px;text-align:center}.step b{display:block;font-size:15px}.step span{font-size:12.5px;color:#6d726e}.fallback{width:100%;border:0;border-radius:16px;padding:15px;margin-top:12px;background:#173f3a;color:#fff;font-size:15px;font-weight:900}.hint{margin-top:10px!important;font-size:12px!important;color:#8c877f!important}.down{font-size:26px;line-height:1;text-align:center;color:#d09b30;margin:1px 0}
  </style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="icon"><img src="/icons/Icon-192.png" alt="Muhajeer Books"></div><div><h1>Muhajeer Books</h1><p id="tag"></p></div></div>
  <div class="device" id="device"></div>
  <h2 id="title"></h2><p class="lead" id="lead"></p>
  <button class="install" id="installBtn"></button>
  <a class="open" id="openBtn" href="/"></a>
  <div class="status" id="status"></div>
  <div class="langs"><button class="lang" data-lang="uz">O‘zbekcha</button><button class="lang" data-lang="ru">Русский</button><button class="lang" data-lang="en">English</button><button class="lang" data-lang="ko">한국어</button></div>
  <p class="small" id="small"></p>
</main>
<div class="overlay" id="overlay"><div class="sheet"><button class="close" id="closeBtn">×</button><h3 id="sheetTitle"></h3><p id="sheetLead"></p><div class="important" id="important"></div><div id="sheetSteps"></div><button class="fallback" id="fallbackBtn"></button><p class="hint" id="hint"></p></div></div>
<script>
(()=>{
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/flutter_service_worker.js').catch(()=>{});
  const T={
    uz:{tag:"Koreyadagi o‘zbek kitob do‘koni",iosDevice:" iPhone aniqlandi",androidDevice:"🤖 Android telefon aniqlandi",iosTitle:"iPhone’ga o‘rnatish",androidTitle:"Android’ga o‘rnatish",iosLead:"Bitta yashil tugmani bosing. Safari ochilgach qolgan joyini aniq ko‘rsatamiz.",androidLead:"Bitta tugmani bosing — o‘rnatish oynasi chiqadi.",iosBtn:" iPHONE’GA O‘RNATISH",androidBtn:"📲 ANDROID’GA O‘RNATISH",open:"Hozir ilovani ochish",iosReady:"Tayyor. Yashil tugmani bosing.",androidReady:"Tayyor. Yashil tugmani bosing.",installed:"Muhajeer Books allaqachon o‘rnatilgan ✅",installedBtn:"✅ O‘RNATILGAN — OCHISH",opening:"Safari ochilmoqda…",sheetTitle:"Bosh ekranga qo‘shish",sheetLead:"Share tugmasi ko‘rinmasa ham muammo emas.",important:"iOS 26/27 da Share tugmasi yashirin bo‘lishi mumkin — avval Safari pastidagi ••• (More) ni bosing.",s1:"••• More ni bosing",s1sub:"Safari pastki panelida",s2:"Share / Ulashish ni bosing",s2sub:"공유 / Поделиться / Share",s3:"Add to Home Screen ni bosing",s3sub:"홈 화면에 추가 / На экран «Домой»",s4:"Add ni bosing",s4sub:"Qo‘shish / 추가 / Добавить",fallback:"SAFARI’DA QAYTA OCHISH",hint:"Agar ••• ham ko‘rinmasa, ekranga bir marta teging yoki sahifani ozgina yuqoriga suring — Safari paneli qayta chiqadi. Add to Home Screen ko‘rinmasa, ro‘yxat pastidagi Edit Actions orqali qo‘shish mumkin.",small:"Telefon va til avtomatik aniqlanadi."},
    ru:{tag:"Узбекский книжный магазин в Корее",iosDevice:" Обнаружен iPhone",androidDevice:"🤖 Обнаружен Android",iosTitle:"Установить на iPhone",androidTitle:"Установить на Android",iosLead:"Нажмите одну зелёную кнопку. После открытия Safari покажем точные шаги.",androidLead:"Нажмите одну кнопку — откроется окно установки.",iosBtn:" УСТАНОВИТЬ НА iPHONE",androidBtn:"📲 УСТАНОВИТЬ НА ANDROID",open:"Открыть приложение",iosReady:"Готово. Нажмите зелёную кнопку.",androidReady:"Готово. Нажмите зелёную кнопку.",installed:"Muhajeer Books уже установлен ✅",installedBtn:"✅ УСТАНОВЛЕНО — ОТКРЫТЬ",opening:"Открываем Safari…",sheetTitle:"Добавить на главный экран",sheetLead:"Если кнопки Share нет — это нормально.",important:"В iOS 26/27 Share может быть скрыта — сначала нажмите ••• (Ещё) внизу Safari.",s1:"Нажмите ••• Ещё",s1sub:"На нижней панели Safari",s2:"Нажмите Поделиться",s2sub:"Share / 공유",s3:"Нажмите На экран «Домой»",s3sub:"Add to Home Screen / 홈 화면에 추가",s4:"Нажмите Добавить",s4sub:"Add / 추가",fallback:"ЕЩЁ РАЗ ОТКРЫТЬ В SAFARI",hint:"Если ••• не видно, один раз коснитесь страницы или слегка прокрутите вверх. Если пункта «На экран Домой» нет, добавьте его через Edit Actions внизу списка.",small:"Телефон и язык определяются автоматически."},
    en:{tag:"Uzbek bookstore in Korea",iosDevice:" iPhone detected",androidDevice:"🤖 Android detected",iosTitle:"Install on iPhone",androidTitle:"Install on Android",iosLead:"Tap one green button. After Safari opens, we’ll show the exact remaining taps.",androidLead:"Tap one button — the install window will appear.",iosBtn:" INSTALL ON iPHONE",androidBtn:"📲 INSTALL ON ANDROID",open:"Open app now",iosReady:"Ready. Tap the green button.",androidReady:"Ready. Tap the green button.",installed:"Muhajeer Books is already installed ✅",installedBtn:"✅ INSTALLED — OPEN",opening:"Opening Safari…",sheetTitle:"Add to Home Screen",sheetLead:"It is normal if the Share button is not visible.",important:"On iOS 26/27 Share may be hidden — first tap ••• (More) at the bottom of Safari.",s1:"Tap ••• More",s1sub:"On Safari’s bottom bar",s2:"Tap Share",s2sub:"Ulashish / 공유 / Поделиться",s3:"Tap Add to Home Screen",s3sub:"홈 화면에 추가 / На экран «Домой»",s4:"Tap Add",s4sub:"Qo‘shish / 추가 / Добавить",fallback:"TRY OPENING SAFARI AGAIN",hint:"If ••• is hidden too, tap the page once or scroll slightly upward to reveal Safari’s toolbar. If Add to Home Screen is missing, add it from Edit Actions at the bottom of the list.",small:"Phone and language are detected automatically."},
    ko:{tag:"한국의 우즈베크어 서점",iosDevice:" iPhone이 감지되었습니다",androidDevice:"🤖 Android가 감지되었습니다",iosTitle:"iPhone에 설치",androidTitle:"Android에 설치",iosLead:"초록색 버튼 하나만 누르세요. Safari가 열리면 남은 단계를 정확히 보여드립니다.",androidLead:"버튼 한 번만 누르면 설치 창이 열립니다.",iosBtn:" iPHONE에 설치",androidBtn:"📲 ANDROID에 설치",open:"지금 앱 열기",iosReady:"준비 완료. 초록색 버튼을 누르세요.",androidReady:"준비 완료. 초록색 버튼을 누르세요.",installed:"Muhajeer Books가 이미 설치되어 있습니다 ✅",installedBtn:"✅ 설치됨 — 열기",opening:"Safari를 여는 중…",sheetTitle:"홈 화면에 추가",sheetLead:"공유 버튼이 안 보여도 정상입니다.",important:"iOS 26/27에서는 공유 버튼이 숨겨질 수 있습니다. 먼저 Safari 아래쪽의 ••• (더 보기)를 누르세요.",s1:"••• 더 보기 누르기",s1sub:"Safari 아래쪽 메뉴",s2:"공유 누르기",s2sub:"Share / Ulashish / Поделиться",s3:"홈 화면에 추가 누르기",s3sub:"Add to Home Screen",s4:"추가 누르기",s4sub:"Add / Qo‘shish / Добавить",fallback:"SAFARI에서 다시 열기",hint:"•••도 안 보이면 화면을 한 번 누르거나 조금 위로 스크롤하면 Safari 메뉴가 다시 나타납니다. 홈 화면에 추가가 없으면 목록 아래의 동작 편집(Edit Actions)에서 추가할 수 있습니다.",small:"휴대폰과 언어가 자동으로 감지됩니다."}
  };
  const ua=navigator.userAgent||'';
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isSafari=isIOS&&/Safari/i.test(ua)&&!/CriOS|FxiOS|EdgiOS|OPiOS|Instagram|FBAN|FBAV|Telegram|KAKAOTALK|NAVER|Line|Threads|Barcelona/i.test(ua);
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const lp=(navigator.language||'uz').toLowerCase().slice(0,2);let lang=['uz','ru','en','ko'].includes(lp)?lp:'uz';let promptEvent=null;
  const $=id=>document.getElementById(id),btn=$('installBtn'),status=$('status'),overlay=$('overlay');
  function render(){const t=T[lang];document.documentElement.lang=lang;$('tag').textContent=t.tag;$('device').textContent=isIOS?t.iosDevice:t.androidDevice;$('title').textContent=isIOS?t.iosTitle:t.androidTitle;$('lead').textContent=isIOS?t.iosLead:t.androidLead;$('openBtn').textContent=t.open;$('small').textContent=t.small;btn.textContent=standalone?t.installedBtn:(isIOS?t.iosBtn:t.androidBtn);status.className='status';status.textContent=standalone?t.installed:(isIOS?t.iosReady:t.androidReady);if(standalone)status.classList.add('ok');document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));}
  function fillSheet(){const t=T[lang];$('sheetTitle').textContent=t.sheetTitle;$('sheetLead').textContent=t.sheetLead;$('important').textContent=t.important;$('sheetSteps').innerHTML=`<div class="step"><div class="num">1</div><div class="glyph">•••</div><div><b>${t.s1}</b><span>${t.s1sub}</span></div></div><div class="down">↓</div><div class="step"><div class="num">2</div><div class="glyph">□↑</div><div><b>${t.s2}</b><span>${t.s2sub}</span></div></div><div class="down">↓</div><div class="step"><div class="num">3</div><div class="glyph">＋</div><div><b>${t.s3}</b><span>${t.s3sub}</span></div></div><div class="down">↓</div><div class="step"><div class="num">4</div><div class="glyph">✓</div><div><b>${t.s4}</b><span>${t.s4sub}</span></div></div>`;$('fallbackBtn').textContent=t.fallback;$('hint').textContent=t.hint;}
  function showSheet(){fillSheet();overlay.classList.add('show');}
  function copyInstall(){const u=location.origin+'/install?iphone=1';try{navigator.clipboard.writeText(u).catch(()=>{});}catch(_){ }return u;}
  function revealSafariChrome(){try{window.scrollTo(0,2);setTimeout(()=>window.scrollTo(0,0),80);setTimeout(()=>window.scrollTo(0,1),180);setTimeout(()=>window.scrollTo(0,0),260);}catch(_){}}
  function trySafari(){const t=T[lang],u=copyInstall(),stripped=u.replace(/^https?:\/\//,'');status.className='status';status.textContent=t.opening;let hidden=false;const onVis=()=>{if(document.visibilityState==='hidden')hidden=true};document.addEventListener('visibilitychange',onVis,{once:true});try{location.href='x-safari-https://'+stripped;}catch(_){ }setTimeout(()=>{if(!hidden){showSheet();status.className='status warn';}},1500);}
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;});
  addEventListener('appinstalled',()=>{promptEvent=null;render();});
  document.querySelectorAll('.lang').forEach(x=>x.onclick=()=>{lang=x.dataset.lang;render();if(overlay.classList.contains('show'))fillSheet();});
  $('closeBtn').onclick=()=>overlay.classList.remove('show');$('fallbackBtn').onclick=()=>{overlay.classList.remove('show');trySafari();};overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show');};
  btn.onclick=async()=>{if(standalone){location.href='/';return;}if(isIOS){if(isSafari){revealSafariChrome();showSheet();return;}trySafari();return;}if(promptEvent){const p=promptEvent;promptEvent=null;await p.prompt();return;}status.className='status warn';status.textContent='Chrome menyusi ⋮ → Install app / Add to Home screen';};
  render();
  if(isIOS&&isSafari&&new URLSearchParams(location.search).get('iphone')==='1'){setTimeout(()=>{revealSafariChrome();showSheet();},250);}
})();
</script>
</body>

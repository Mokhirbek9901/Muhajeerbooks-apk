<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F3EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Muhajeer Books">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/Icon-192.png">
  <link rel="icon" href="/favicon.png">
  <title>Muhajeer Books — O‘rnatish</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;color:#173834;background:#f7f3ea}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f7f3ea;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
    .card{width:min(100%,480px);background:#fff;border:1px solid #e8d8b7;border-radius:28px;padding:25px 22px;box-shadow:0 18px 48px rgba(28,56,51,.09)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.icon{width:68px;height:68px;border-radius:19px;border:1px solid #e7d4ad;overflow:hidden}.icon img{width:100%;height:100%;object-fit:cover}.brand h1{font-size:24px;margin:0}.brand p{margin:5px 0 0;color:#746d61;font-size:14px;font-weight:650}
    .device{text-align:center;font-size:13px;font-weight:900;color:#0f6e65;margin-bottom:10px}h2{text-align:center;font-size:25px;margin:0 0 8px}.lead{text-align:center;color:#5f655f;font-size:15px;line-height:1.5;margin:0 0 18px}
    .install{width:100%;border:0;border-radius:18px;padding:20px 16px;background:#0f6e65;color:#fff;font-size:18px;font-weight:950;cursor:pointer;box-shadow:0 10px 24px rgba(15,110,101,.18)}
    .status{margin-top:13px;padding:12px;border-radius:14px;background:#edf7f3;color:#285b52;font-size:13.5px;line-height:1.45;text-align:center}.status.warn{background:#fff4e8;color:#7c4d17}.status.ok{background:#eaf8f1;color:#176a50;font-weight:850}
    .open{display:block;margin-top:10px;text-align:center;text-decoration:none;background:#edf5f2;color:#0f6e65;border-radius:15px;padding:12px 14px;font-weight:850}
    .langs{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:16px}.lang{border:0;background:transparent;color:#8a8378;padding:5px 7px;font-size:12px;font-weight:800}.lang.active{color:#0f6e65;text-decoration:underline;text-underline-offset:3px}.small{text-align:center;color:#989188;font-size:12px;margin:10px 0 0}
    .coach{position:fixed;inset:0;z-index:9999;background:rgba(7,26,23,.82);display:none;pointer-events:none}.coach.show{display:block}.coachBox{position:absolute;left:16px;right:16px;background:#fff;border-radius:24px;padding:18px;box-shadow:0 18px 55px rgba(0,0,0,.28);pointer-events:auto}.coach.top .coachBox{top:calc(92px + env(safe-area-inset-top))}.coach.bottom .coachBox{bottom:calc(88px + env(safe-area-inset-bottom))}.coach h3{margin:0 0 8px;text-align:center;font-size:22px}.coach p{margin:0;color:#5e655f;text-align:center;line-height:1.45;font-size:14px}.bigGlyph{text-align:center;font-size:44px;font-weight:950;color:#0f6e65;line-height:1;margin:8px 0}.arrowUp,.arrowDown{text-align:center;font-size:42px;font-weight:950;color:#dca83e;line-height:1;animation:bounce 1s infinite}.arrowUp{margin-bottom:8px}.arrowDown{margin-top:8px}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
    .closeCoach{width:100%;border:0;border-radius:15px;padding:14px;margin-top:13px;background:#173f3a;color:#fff;font-size:15px;font-weight:900;pointer-events:auto}
    .steps{margin-top:12px;display:grid;gap:9px}.step{display:flex;align-items:center;gap:11px;padding:12px;border:2px solid #dcebe7;border-radius:16px;background:#fbfdfc}.n{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dca83e;color:#173834;font-weight:950}.step b{font-size:15px}.step span{font-size:12.5px;color:#737973;display:block;margin-top:2px}
  </style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="icon"><img src="/icons/Icon-192.png" alt="Muhajeer Books"></div><div><h1>Muhajeer Books</h1><p id="tag"></p></div></div>
  <div class="device" id="device"></div>
  <h2 id="title"></h2>
  <p class="lead" id="lead"></p>
  <button class="install" id="installBtn"></button>
  <a class="open" id="openBtn" href="/"></a>
  <div class="status" id="status"></div>
  <div class="langs"><button class="lang" data-lang="uz">O‘zbekcha</button><button class="lang" data-lang="ru">Русский</button><button class="lang" data-lang="en">English</button><button class="lang" data-lang="ko">한국어</button></div>
  <p class="small" id="small"></p>
</main>

<div class="coach top" id="inAppCoach"><div class="coachBox"><div class="arrowUp">↑</div><h3 id="inAppTitle"></h3><div class="bigGlyph">•••</div><p id="inAppText"></p><button class="closeCoach" id="closeInApp"></button></div></div>
<div class="coach bottom" id="safariCoach"><div class="coachBox"><h3 id="safariTitle"></h3><p id="safariText"></p><div class="steps" id="safariSteps"></div><div class="arrowDown">↓</div><button class="closeCoach" id="closeSafari"></button></div></div>

<script>
(()=>{
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/flutter_service_worker.js').catch(()=>{});
  const T={
    uz:{tag:"Koreyadagi o‘zbek kitob do‘koni",iosDevice:" iPhone aniqlandi",androidDevice:"🤖 Android telefon aniqlandi",iosTitle:"iPhone’ga o‘rnatish",androidTitle:"Android’ga o‘rnatish",iosLeadInApp:"Bitta tugmani bosing — Safari’da ochib, keyin o‘rnatishni davom ettirasiz.",iosLeadSafari:"Bitta tugmani bosing — qayerni bosish kerakligi darrov ko‘rinadi.",androidLead:"Bitta tugmani bosing — o‘rnatish oynasi chiqadi.",iosBtnInApp:" SAFARI’DA OCHIB O‘RNATISH",iosBtnSafari:"＋ BOSH EKRANGA QO‘SHISH",androidBtn:"📲 ANDROID’GA O‘RNATISH",open:"Hozir ilovani ochish",opening:"Safari ochilmoqda…",ready:"Tayyor — tugmani bosing.",installed:"Muhajeer Books allaqachon o‘rnatilgan ✅",installedBtn:"✅ O‘RNATILGAN — OCHISH",inAppTitle:"Safari’da ochish",inAppText:"Agar Safari avtomatik ochilmasa, aynan tepadagi ••• ni bosing va “Open in Safari / Safari’da ochish” ni tanlang.",safariTitle:"Bosh ekranga qo‘shish",safariText:"Safari paneli ko‘rinmasa ekranga bir marta teging. So‘ng quyidagilarni bosing:",steps:[["••• / Share","Safari pastki yoki yuqori panelida"],["Add to Home Screen","홈 화면에 추가 / На экран «Домой»"],["Add","Qo‘shish / 추가 / Добавить"]],close:"TUSHUNDIM",small:"Telefon va til avtomatik aniqlanadi."},
    ru:{tag:"Узбекский книжный магазин в Корее",iosDevice:" Обнаружен iPhone",androidDevice:"🤖 Обнаружен Android",iosTitle:"Установить на iPhone",androidTitle:"Установить на Android",iosLeadInApp:"Нажмите одну кнопку — откройте Safari и продолжите установку.",iosLeadSafari:"Нажмите одну кнопку — сразу покажем, куда нажать.",androidLead:"Нажмите одну кнопку — откроется окно установки.",iosBtnInApp:" ОТКРЫТЬ В SAFARI И УСТАНОВИТЬ",iosBtnSafari:"＋ ДОБАВИТЬ НА ГЛАВНЫЙ ЭКРАН",androidBtn:"📲 УСТАНОВИТЬ НА ANDROID",open:"Открыть приложение",opening:"Открываем Safari…",ready:"Готово — нажмите кнопку.",installed:"Muhajeer Books уже установлен ✅",installedBtn:"✅ УСТАНОВЛЕНО — ОТКРЫТЬ",inAppTitle:"Открыть в Safari",inAppText:"Если Safari не открылся автоматически, нажмите именно верхние ••• и выберите “Open in Safari / Открыть в Safari”.",safariTitle:"Добавить на главный экран",safariText:"Если панель Safari скрыта, коснитесь экрана один раз. Затем нажмите:",steps:[["••• / Share","В нижней или верхней панели Safari"],["На экран «Домой»","Add to Home Screen / 홈 화면에 추가"],["Добавить","Add / 추가"]],close:"ПОНЯТНО",small:"Телефон и язык определяются автоматически."},
    en:{tag:"Uzbek bookstore in Korea",iosDevice:" iPhone detected",androidDevice:"🤖 Android detected",iosTitle:"Install on iPhone",androidTitle:"Install on Android",iosLeadInApp:"Tap one button — open in Safari, then continue installation.",iosLeadSafari:"Tap one button — we’ll immediately show where to press.",androidLead:"Tap one button — the install window will appear.",iosBtnInApp:" OPEN IN SAFARI & INSTALL",iosBtnSafari:"＋ ADD TO HOME SCREEN",androidBtn:"📲 INSTALL ON ANDROID",open:"Open app now",opening:"Opening Safari…",ready:"Ready — tap the button.",installed:"Muhajeer Books is already installed ✅",installedBtn:"✅ INSTALLED — OPEN",inAppTitle:"Open in Safari",inAppText:"If Safari does not open automatically, tap the top ••• and choose “Open in Safari”.",safariTitle:"Add to Home Screen",safariText:"If Safari’s toolbar is hidden, tap the page once. Then tap:",steps:[["••• / Share","On Safari’s bottom or top toolbar"],["Add to Home Screen","홈 화면에 추가 / На экран «Домой»"],["Add","추가 / Добавить"]],close:"GOT IT",small:"Phone and language are detected automatically."},
    ko:{tag:"한국의 우즈베크어 서점",iosDevice:" iPhone이 감지되었습니다",androidDevice:"🤖 Android가 감지되었습니다",iosTitle:"iPhone에 설치",androidTitle:"Android에 설치",iosLeadInApp:"버튼 하나를 눌러 Safari에서 연 뒤 설치를 계속하세요.",iosLeadSafari:"버튼 하나만 누르면 어디를 눌러야 하는지 바로 보여줍니다.",androidLead:"버튼 한 번만 누르면 설치 창이 열립니다.",iosBtnInApp:" SAFARI에서 열고 설치",iosBtnSafari:"＋ 홈 화면에 추가",androidBtn:"📲 ANDROID에 설치",open:"지금 앱 열기",opening:"Safari를 여는 중…",ready:"준비 완료 — 버튼을 누르세요.",installed:"Muhajeer Books가 이미 설치되어 있습니다 ✅",installedBtn:"✅ 설치됨 — 열기",inAppTitle:"Safari에서 열기",inAppText:"Safari가 자동으로 열리지 않으면 위쪽 •••를 누르고 “Safari에서 열기”를 선택하세요.",safariTitle:"홈 화면에 추가",safariText:"Safari 도구막대가 숨겨져 있으면 화면을 한 번 누르세요. 그 다음:",steps:[["••• / 공유","Safari 아래쪽 또는 위쪽 도구막대"],["홈 화면에 추가","Add to Home Screen / На экран «Домой»"],["추가","Add / Добавить"]],close:"확인",small:"휴대폰과 언어가 자동으로 감지됩니다."}
  };

  const ua=navigator.userAgent||'';
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const inApp=isIOS&&/Instagram|FBAN|FBAV|Telegram|KAKAOTALK|NAVER|Line|Threads|Barcelona/i.test(ua);
  const isSafari=isIOS&&/Safari/i.test(ua)&&!/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua)&&!inApp;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const lp=(navigator.language||'uz').toLowerCase().slice(0,2);
  let lang=['uz','ru','en','ko'].includes(lp)?lp:'uz';
  let promptEvent=null;
  const $=id=>document.getElementById(id);

  function render(){
    const t=T[lang];
    document.documentElement.lang=lang;
    $('tag').textContent=t.tag;
    $('device').textContent=isIOS?t.iosDevice:t.androidDevice;
    $('title').textContent=isIOS?t.iosTitle:t.androidTitle;
    $('lead').textContent=isIOS?(inApp?t.iosLeadInApp:t.iosLeadSafari):t.androidLead;
    $('openBtn').textContent=t.open;
    $('small').textContent=t.small;
    $('installBtn').textContent=standalone?t.installedBtn:(isIOS?(inApp?t.iosBtnInApp:t.iosBtnSafari):t.androidBtn);
    $('status').className='status';
    $('status').textContent=standalone?t.installed:t.ready;
    if(standalone)$('status').classList.add('ok');
    $('inAppTitle').textContent=t.inAppTitle;$('inAppText').textContent=t.inAppText;$('closeInApp').textContent=t.close;
    $('safariTitle').textContent=t.safariTitle;$('safariText').textContent=t.safariText;$('closeSafari').textContent=t.close;
    $('safariSteps').innerHTML=t.steps.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('');
    document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));
  }

  function showInAppCoach(){render();$('inAppCoach').classList.add('show');}
  function showSafariCoach(){render();$('safariCoach').classList.add('show');}
  function closeCoaches(){$('inAppCoach').classList.remove('show');$('safariCoach').classList.remove('show');}
  function installUrl(){return location.origin+'/install?iphone=1';}
  function copyInstall(){try{navigator.clipboard.writeText(installUrl()).catch(()=>{});}catch(_){}}

  function tryOpenSafari(){
    const t=T[lang],u=installUrl(),stripped=u.replace(/^https?:\/\//,'');
    copyInstall();
    $('status').className='status';$('status').textContent=t.opening;
    let left=false;
    const onVis=()=>{if(document.visibilityState==='hidden')left=true;};
    document.addEventListener('visibilitychange',onVis,{once:true});
    try{location.href='x-safari-https://'+stripped;}catch(_){ }
    setTimeout(()=>{if(!left){try{location.href='com-apple-mobilesafari-tab:'+u;}catch(_){ }}},650);
    setTimeout(()=>{if(!left)showInAppCoach();},1450);
  }

  addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;render();});
  addEventListener('appinstalled',()=>{promptEvent=null;render();});
  document.querySelectorAll('.lang').forEach(x=>x.onclick=()=>{lang=x.dataset.lang;render();});
  $('closeInApp').onclick=closeCoaches;$('closeSafari').onclick=closeCoaches;

  $('installBtn').onclick=async()=>{
    if(standalone){location.href='/';return;}
    if(isIOS){
      if(inApp){tryOpenSafari();return;}
      showSafariCoach();return;
    }
    if(promptEvent){const p=promptEvent;promptEvent=null;await p.prompt();return;}
    $('status').className='status warn';
    $('status').textContent='Chrome menyusi ⋮ → Install app / Add to Home screen';
  };

  render();
  if(isIOS&&!inApp&&new URLSearchParams(location.search).get('iphone')==='1')setTimeout(showSafariCoach,300);
})();
</script>
</body>
</html>

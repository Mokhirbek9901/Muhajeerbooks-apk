<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F3EA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Muhajeer Books">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/Icon-192.png">
  <link rel="icon" href="/favicon.png">
  <title>Muhajeer Books — O‘rnatish</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;color:#173834;background:#f7f3ea}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f7f3ea;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
    .card{width:min(100%,480px);background:#fff;border:1px solid #e8d8b7;border-radius:28px;padding:25px 22px;box-shadow:0 18px 48px rgba(28,56,51,.09)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.icon{width:68px;height:68px;border-radius:19px;border:1px solid #e7d4ad;overflow:hidden}.icon img{width:100%;height:100%;object-fit:cover}.brand h1{font-size:24px;margin:0}.brand p{margin:5px 0 0;color:#746d61;font-size:14px;font-weight:650}
    .device{text-align:center;font-size:13px;font-weight:900;color:#0f6e65;margin-bottom:10px}h2{text-align:center;font-size:25px;margin:0 0 8px}.lead{text-align:center;color:#5f655f;font-size:15px;line-height:1.5;margin:0 0 18px}
    .btn{width:100%;border:0;border-radius:18px;padding:19px 16px;font-size:17px;font-weight:950;cursor:pointer;margin-top:10px}.primary{background:#0f6e65;color:#fff;box-shadow:0 10px 24px rgba(15,110,101,.18)}.secondary{background:#edf5f2;color:#0f6e65;border:2px solid #cfe2dc}.dark{background:#173f3a;color:#fff}
    .stepbadge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#dca83e;color:#173834;margin-right:8px;font-size:14px;font-weight:950;vertical-align:middle}
    .status{margin-top:13px;padding:12px;border-radius:14px;background:#edf7f3;color:#285b52;font-size:13.5px;line-height:1.45;text-align:center}.status.warn{background:#fff4e8;color:#7c4d17}.status.ok{background:#eaf8f1;color:#176a50;font-weight:850}
    .open{display:block;margin-top:10px;text-align:center;text-decoration:none;background:#edf5f2;color:#0f6e65;border-radius:15px;padding:12px 14px;font-weight:850}
    .iphoneActions{display:none}.androidActions{display:none}.readyNote{margin:12px 0 0;text-align:center;color:#737a74;font-size:13px;line-height:1.45}
    .langs{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:16px}.lang{border:0;background:transparent;color:#8a8378;padding:5px 7px;font-size:12px;font-weight:800}.lang.active{color:#0f6e65;text-decoration:underline;text-underline-offset:3px}.small{text-align:center;color:#989188;font-size:12px;margin:10px 0 0}
    .overlay{position:fixed;inset:0;z-index:9999;background:rgba(9,29,26,.84);display:none;align-items:flex-end;justify-content:center;padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}.overlay.show{display:flex}
    .sheet{position:relative;width:min(100%,500px);background:#fff;border-radius:28px;padding:22px;box-shadow:0 18px 55px rgba(0,0,0,.3)}.sheet h3{font-size:23px;margin:0 42px 7px;text-align:center}.sheet p{text-align:center;margin:0 0 15px;color:#656b66;line-height:1.45}.close{position:absolute;right:16px;top:14px;border:0;background:#eef1ef;width:38px;height:38px;border-radius:50%;font-size:22px;font-weight:900}
    .coach{display:flex;align-items:center;gap:12px;border:2px solid #d7e8e3;border-radius:18px;padding:14px;margin:10px 0;background:#f9fcfb}.num{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#dca83e;color:#173834;font-size:18px;font-weight:950}.glyph{font-size:30px;font-weight:900;color:#0f6e65;min-width:48px;text-align:center}.coach b{display:block;font-size:16px;margin-bottom:2px}.coach span{font-size:13px;color:#6d726e}.arrow{text-align:center;font-size:31px;line-height:1;color:#d09b30;margin:2px 0}
    .toolbarCoach{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:10001;display:none;pointer-events:none}.toolbarCoach.show{display:block}.toolbarBubble{margin:auto;width:min(100%,460px);background:#173f3a;color:white;border-radius:20px;padding:15px 16px;text-align:center;font-size:15px;font-weight:900;box-shadow:0 12px 35px rgba(0,0,0,.28)}.toolbarArrow{font-size:36px;line-height:1;margin-bottom:4px;animation:bounce 1s infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
  </style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="icon"><img src="/icons/Icon-192.png" alt="Muhajeer Books"></div><div><h1>Muhajeer Books</h1><p id="tag"></p></div></div>
  <div class="device" id="device"></div>
  <h2 id="title"></h2>
  <p class="lead" id="lead"></p>

  <div class="iphoneActions" id="iphoneActions">
    <button class="btn primary" id="safariBtn"><span class="stepbadge">1</span><span id="safariText"></span></button>
    <button class="btn dark" id="homeBtn"><span class="stepbadge" id="homeStep">2</span><span id="homeText"></span></button>
    <p class="readyNote" id="iphoneNote"></p>
  </div>

  <div class="androidActions" id="androidActions">
    <button class="btn primary" id="androidBtn"></button>
  </div>

  <a class="open" id="openBtn" href="/"></a>
  <div class="status" id="status"></div>
  <div class="langs"><button class="lang" data-lang="uz">O‘zbekcha</button><button class="lang" data-lang="ru">Русский</button><button class="lang" data-lang="en">English</button><button class="lang" data-lang="ko">한국어</button></div>
  <p class="small" id="small"></p>
</main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close" id="closeBtn">×</button>
    <h3 id="sheetTitle"></h3>
    <p id="sheetLead"></p>
    <div id="sheetSteps"></div>
  </div>
</div>

<div class="toolbarCoach" id="toolbarCoach"><div class="toolbarBubble"><div class="toolbarArrow">↓</div><div id="toolbarText"></div></div></div>

<script>
(()=>{
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/flutter_service_worker.js').catch(()=>{});

  const T={
    uz:{tag:"Koreyadagi o‘zbek kitob do‘koni",iosDevice:" iPhone aniqlandi",androidDevice:"🤖 Android telefon aniqlandi",iosTitle:"iPhone’ga o‘rnatish",androidTitle:"Android’ga o‘rnatish",iosLeadInApp:"2 ta katta tugma xolos.",iosLeadSafari:"Bitta katta tugma xolos.",androidLead:"Bitta tugmani bosing — o‘rnatish oynasi chiqadi.",safari:"SAFARI’DA OCHISH",home:"BOSH EKRANGA QO‘SHISH",android:"📲 ANDROID’GA O‘RNATISH",open:"Hozir ilovani ochish",noteInApp:"Avval 1 ni bosing. Safari ochilgach 2 ni bosing.",noteSafari:"Tugmani bosing — qayerni bosish kerakligi ekranda ko‘rinadi.",opening:"Safari ochilmoqda…",blocked:"Safari avtomatik ochilmasa, Instagram tepasidagi ••• → Open in Safari ni bir marta bosing.",installed:"Muhajeer Books allaqachon o‘rnatilgan ✅",sheetTitle:"Bosh ekranga qo‘shish",sheetLead:"Safari panelini chiqarib, mana shu ketma-ketlikni bosing:",more:"••• More / Menyu",moreSub:"Safari pastki yoki yuqori panelida",share:"Share / Ulashish",shareSub:"□↑ belgisi",addHome:"Add to Home Screen",addHomeSub:"홈 화면에 추가 / На экран «Домой»",add:"Add",addSub:"Qo‘shish / 추가 / Добавить",toolbar:"Safari paneli ko‘rinmasa, ekranga bir marta teging yoki sahifani biroz yuqoriga suring. Keyin ••• ni bosing.",small:"Telefon va til avtomatik aniqlanadi."},
    ru:{tag:"Узбекский книжный магазин в Корее",iosDevice:" Обнаружен iPhone",androidDevice:"🤖 Обнаружен Android",iosTitle:"Установить на iPhone",androidTitle:"Установить на Android",iosLeadInApp:"Всего 2 большие кнопки.",iosLeadSafari:"Всего одна большая кнопка.",androidLead:"Нажмите одну кнопку — откроется окно установки.",safari:"ОТКРЫТЬ В SAFARI",home:"ДОБАВИТЬ НА ГЛАВНЫЙ ЭКРАН",android:"📲 УСТАНОВИТЬ НА ANDROID",open:"Открыть приложение",noteInApp:"Сначала нажмите 1. После открытия Safari нажмите 2.",noteSafari:"Нажмите кнопку — покажем точное место на экране.",opening:"Открываем Safari…",blocked:"Если Safari не открылся автоматически: в Instagram нажмите ••• → Open in Safari один раз.",installed:"Muhajeer Books уже установлен ✅",sheetTitle:"Добавить на главный экран",sheetLead:"Покажите панель Safari и нажмите по порядку:",more:"••• More / Меню",moreSub:"В нижней или верхней панели Safari",share:"Share / Поделиться",shareSub:"Значок □↑",addHome:"На экран «Домой»",addHomeSub:"Add to Home Screen / 홈 화면에 추가",add:"Добавить",addSub:"Add / 추가",toolbar:"Если панель Safari скрыта, коснитесь экрана или немного прокрутите страницу вверх. Затем нажмите •••.",small:"Телефон и язык определяются автоматически."},
    en:{tag:"Uzbek bookstore in Korea",iosDevice:" iPhone detected",androidDevice:"🤖 Android detected",iosTitle:"Install on iPhone",androidTitle:"Install on Android",iosLeadInApp:"Only 2 big buttons.",iosLeadSafari:"Only one big button.",androidLead:"Tap one button — the install window will appear.",safari:"OPEN IN SAFARI",home:"ADD TO HOME SCREEN",android:"📲 INSTALL ON ANDROID",open:"Open app now",noteInApp:"Tap 1 first. After Safari opens, tap 2.",noteSafari:"Tap the button — the exact place to press will appear.",opening:"Opening Safari…",blocked:"If Safari does not open automatically, tap Instagram ••• → Open in Safari once.",installed:"Muhajeer Books is already installed ✅",sheetTitle:"Add to Home Screen",sheetLead:"Show the Safari toolbar and tap these in order:",more:"••• More / Menu",moreSub:"On Safari’s bottom or top toolbar",share:"Share",shareSub:"The □↑ icon",addHome:"Add to Home Screen",addHomeSub:"홈 화면에 추가 / На экран «Домой»",add:"Add",addSub:"추가 / Добавить",toolbar:"If Safari’s toolbar is hidden, tap the page once or scroll slightly upward. Then tap •••.",small:"Phone and language are detected automatically."},
    ko:{tag:"한국의 우즈베크어 서점",iosDevice:" iPhone이 감지되었습니다",androidDevice:"🤖 Android가 감지되었습니다",iosTitle:"iPhone에 설치",androidTitle:"Android에 설치",iosLeadInApp:"큰 버튼 2개만 사용하세요.",iosLeadSafari:"큰 버튼 하나만 사용하세요.",androidLead:"버튼 한 번만 누르면 설치 창이 열립니다.",safari:"SAFARI에서 열기",home:"홈 화면에 추가",android:"📲 ANDROID에 설치",open:"지금 앱 열기",noteInApp:"먼저 1을 누르고, Safari가 열리면 2를 누르세요.",noteSafari:"버튼을 누르면 정확히 어디를 눌러야 하는지 표시됩니다.",opening:"Safari를 여는 중…",blocked:"Safari가 자동으로 열리지 않으면 Instagram의 ••• → Safari에서 열기를 한 번 누르세요.",installed:"Muhajeer Books가 이미 설치되어 있습니다 ✅",sheetTitle:"홈 화면에 추가",sheetLead:"Safari 도구막대를 보이게 한 뒤 순서대로 누르세요:",more:"••• 더보기 / 메뉴",moreSub:"Safari 아래쪽 또는 위쪽 도구막대",share:"공유",shareSub:"□↑ 아이콘",addHome:"홈 화면에 추가",addHomeSub:"Add to Home Screen / На экран «Домой»",add:"추가",addSub:"Add / Добавить",toolbar:"Safari 도구막대가 숨겨져 있으면 화면을 한 번 누르거나 페이지를 조금 위로 스크롤하세요. 그런 다음 •••를 누르세요.",small:"휴대폰과 언어가 자동으로 감지됩니다."}
  };

  const ua=navigator.userAgent||'';
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isInApp=isIOS&&/Instagram|FBAN|FBAV|Telegram|KAKAOTALK|NAVER|Line|Threads|Barcelona/i.test(ua);
  const isSafari=isIOS&&/Safari/i.test(ua)&&!/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua)&&!isInApp;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const lp=(navigator.language||'uz').toLowerCase().slice(0,2);
  let lang=['uz','ru','en','ko'].includes(lp)?lp:'uz';
  let promptEvent=null;
  const $=id=>document.getElementById(id);

  function render(){
    const t=T[lang];
    document.documentElement.lang=lang;
    $('tag').textContent=t.tag;
    $('device').textContent=isIOS?t.iosDevice:t.androidDevice;
    $('title').textContent=isIOS?t.iosTitle:t.androidTitle;
    $('openBtn').textContent=t.open;
    $('small').textContent=t.small;
    $('status').className='status';
    $('iphoneActions').style.display=isIOS?'block':'none';
    $('androidActions').style.display=isIOS?'none':'block';

    if(standalone){
      $('lead').textContent=t.installed;
      $('status').classList.add('ok');
      $('status').textContent=t.installed;
      $('iphoneActions').style.display='none';
      $('androidActions').style.display='none';
    }else if(isIOS){
      const safariMode=isSafari||new URLSearchParams(location.search).get('iphone')==='1';
      $('lead').textContent=safariMode?t.iosLeadSafari:t.iosLeadInApp;
      $('safariBtn').style.display=safariMode?'none':'block';
      $('homeStep').style.display=safariMode?'none':'inline-grid';
      $('safariText').textContent=t.safari;
      $('homeText').textContent=t.home;
      $('iphoneNote').textContent=safariMode?t.noteSafari:t.noteInApp;
      $('status').textContent=safariMode?t.noteSafari:t.noteInApp;
    }else{
      $('lead').textContent=t.androidLead;
      $('androidBtn').textContent=t.android;
      $('status').textContent=promptEvent?'Tayyor. Yashil tugmani bosing.':'O‘rnatish tayyorlanmoqda…';
    }
    document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));
  }

  function copyInstall(){
    const u=location.origin+'/install?iphone=1';
    try{navigator.clipboard.writeText(u).catch(()=>{});}catch(_){ }
    return u;
  }

  function openSafari(){
    const t=T[lang],u=copyInstall(),stripped=u.replace(/^https?:\/\//,'');
    $('status').className='status';$('status').textContent=t.opening;
    let hidden=false;
    const onVis=()=>{if(document.visibilityState==='hidden')hidden=true};
    document.addEventListener('visibilitychange',onVis,{once:true});
    try{location.href='x-safari-https://'+stripped;}catch(_){ }
    setTimeout(()=>{if(!hidden){try{window.open(u,'_blank','noopener');}catch(_){ }}},550);
    setTimeout(()=>{if(!hidden){$('status').className='status warn';$('status').textContent=t.blocked;}},1400);
  }

  function showHomeGuide(){
    const t=T[lang];
    try{window.scrollTo({top:0,behavior:'smooth'});}catch(_){window.scrollTo(0,0)}
    $('sheetTitle').textContent=t.sheetTitle;
    $('sheetLead').textContent=t.sheetLead;
    $('sheetSteps').innerHTML=`
      <div class="coach"><div class="num">1</div><div class="glyph">•••</div><div><b>${t.more}</b><span>${t.moreSub}</span></div></div>
      <div class="arrow">↓</div>
      <div class="coach"><div class="num">2</div><div class="glyph">□↑</div><div><b>${t.share}</b><span>${t.shareSub}</span></div></div>
      <div class="arrow">↓</div>
      <div class="coach"><div class="num">3</div><div class="glyph">＋</div><div><b>${t.addHome}</b><span>${t.addHomeSub}</span></div></div>
      <div class="arrow">↓</div>
      <div class="coach"><div class="num">4</div><div class="glyph">✓</div><div><b>${t.add}</b><span>${t.addSub}</span></div></div>`;
    $('overlay').classList.add('show');
    $('toolbarText').textContent=t.toolbar;
    $('toolbarCoach').classList.add('show');
    setTimeout(()=>$('toolbarCoach').classList.remove('show'),6500);
  }

  addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;render();});
  addEventListener('appinstalled',()=>{promptEvent=null;render();});
  document.querySelectorAll('.lang').forEach(x=>x.onclick=()=>{lang=x.dataset.lang;render();});
  $('closeBtn').onclick=()=>{$('overlay').classList.remove('show');$('toolbarCoach').classList.remove('show');};
  $('overlay').onclick=e=>{if(e.target===$('overlay')){$('overlay').classList.remove('show');$('toolbarCoach').classList.remove('show');}};
  $('safariBtn').onclick=openSafari;
  $('homeBtn').onclick=()=>{
    if(isIOS&&!isSafari&&new URLSearchParams(location.search).get('iphone')!=='1'){
      openSafari();
      return;
    }
    showHomeGuide();
  };
  $('androidBtn').onclick=async()=>{
    if(promptEvent){const p=promptEvent;promptEvent=null;await p.prompt();return;}
    $('status').className='status warn';$('status').textContent='Chrome menyusi ⋮ → Install app / Add to Home screen';
  };

  render();
})();
</script>
</body>
</html>

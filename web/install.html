<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F3EA">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Muhajeer Books ilovasini telefon bosh ekraniga o‘rnating">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muhajeer Books">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icons/Icon-192.png">
  <link rel="canonical" href="https://muhajeer-books-live-production.up.railway.app/install">
  <title>Muhajeer Books — Install</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;color:#173834;background:#f7f3ea}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f7f3ea;padding:calc(22px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
    .card{width:min(100%,480px);background:#fff;border:1px solid #e8d8b7;border-radius:28px;padding:28px 22px;box-shadow:0 18px 48px rgba(28,56,51,.09)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}.icon{width:70px;height:70px;border-radius:20px;border:1px solid #e7d4ad;overflow:hidden;flex:0 0 70px}.icon img{width:100%;height:100%;object-fit:cover}.brand h1{font-size:25px;margin:0;line-height:1.05}.brand p{margin:6px 0 0;color:#746d61;font-size:14px;font-weight:650}
    h2{font-size:25px;line-height:1.18;margin:0 0 10px;text-align:center}.lead{font-size:15.5px;line-height:1.5;color:#60645f;text-align:center;margin:0 0 24px}
    .install{width:100%;border:0;border-radius:18px;padding:18px 18px;background:#0f6e65;color:#fff;font-size:19px;font-weight:850;cursor:pointer;box-shadow:0 10px 24px rgba(15,110,101,.18)}.install:disabled{opacity:.6;cursor:default}
    .open{display:block;margin-top:11px;text-align:center;text-decoration:none;background:#edf5f2;color:#0f6e65;border-radius:16px;padding:13px 16px;font-weight:800}
    .status{margin-top:17px;padding:13px 14px;border-radius:15px;background:#edf7f3;color:#285b52;font-size:14px;line-height:1.45;text-align:center}.status.warn{background:#fff4e8;color:#7c4d17}.status.ok{background:#eaf8f1;color:#176a50;font-weight:800}
    .help{display:none;margin-top:16px;padding:16px;background:#fbf8f1;border:1px solid #eadfc8;border-radius:18px}.help.show{display:block}.help-title{font-weight:850;font-size:16px;margin-bottom:8px}.help-row{display:flex;gap:10px;align-items:flex-start;margin:9px 0;color:#434a46;font-size:14px;line-height:1.45}.num{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#dca83e;color:#173834;font-weight:900}
    .langs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:18px}.lang{border:0;background:transparent;color:#8a8378;padding:5px 7px;font-size:12px;font-weight:800;cursor:pointer}.lang.active{color:#0f6e65;text-decoration:underline;text-underline-offset:3px}
    .small{text-align:center;color:#989188;font-size:12px;margin:12px 0 0}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="icon"><img src="/icons/Icon-192.png" alt="Muhajeer Books"></div>
      <div><h1>Muhajeer Books</h1><p id="tagline"></p></div>
    </div>

    <h2 id="title"></h2>
    <p class="lead" id="lead"></p>

    <button class="install" id="installBtn"></button>
    <a class="open" href="/" id="openBtn"></a>

    <div class="status" id="status"></div>
    <div class="help" id="help">
      <div class="help-title" id="helpTitle"></div>
      <div id="helpBody"></div>
    </div>

    <div class="langs">
      <button class="lang" data-lang="uz">O‘zbekcha</button>
      <button class="lang" data-lang="ru">Русский</button>
      <button class="lang" data-lang="en">English</button>
      <button class="lang" data-lang="ko">한국어</button>
    </div>
    <p class="small" id="small"></p>
  </main>

<script>
(() => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/flutter_service_worker.js').catch(() => {});

  const texts = {
    uz:{tag:"Koreyadagi o‘zbek kitob do‘koni",title:"Muhajeer Books’ni o‘rnating",lead:"Bitta tugmani bosing. Keyin ilova bosh ekrandan oddiy ilovadek ochiladi.",install:"📲 O‘RNATISH",open:"Hozir ilovani ochish",preparing:"O‘rnatish tayyorlanmoqda…",androidReady:"Tayyor — “O‘RNATISH”ni bosing.",androidHelp:"O‘rnatish oynasi chiqmasa",androidSteps:["Chrome menyusidagi <b>⋮</b> ni bosing.","<b>Install app / Add to Home screen</b> ni tanlang."],iosReady:"“O‘RNATISH”ni bosing — ulashish oynasi ochiladi.",iosHelp:"iPhone’da oxirgi 2 qadam",iosSteps:["Ochilgan oynadan <b>“Add to Home Screen / 홈 화면에 추가 / На экран «Домой»”</b> ni bosing.","Keyin <b>“Add / 추가 / Добавить”</b> ni bosing."],iosSafari:"Agar tugma ishlamasa, shu linkni <b>Safari</b>da oching va qayta bosing.",installed:"Muhajeer Books allaqachon o‘rnatilgan ✅",installedBtn:"✅ O‘RNATILGAN — OCHISH",small:"Telefon va til avtomatik aniqlanadi."},
    ru:{tag:"Узбекский книжный магазин в Корее",title:"Установите Muhajeer Books",lead:"Нажмите одну кнопку. После этого приложение будет открываться с главного экрана как обычное приложение.",install:"📲 УСТАНОВИТЬ",open:"Открыть приложение",preparing:"Подготовка установки…",androidReady:"Готово — нажмите «УСТАНОВИТЬ».",androidHelp:"Если окно установки не появилось",androidSteps:["Откройте меню Chrome <b>⋮</b>.","Выберите <b>«Установить приложение» / «Добавить на главный экран»</b>."],iosReady:"Нажмите «УСТАНОВИТЬ» — откроется меню «Поделиться».",iosHelp:"Последние 2 шага на iPhone",iosSteps:["В открывшемся меню нажмите <b>«На экран «Домой» / Add to Home Screen / 홈 화면에 추가»</b>.","Затем нажмите <b>«Добавить / Add / 추가»</b>."],iosSafari:"Если кнопка не сработала, откройте эту ссылку в <b>Safari</b> и нажмите ещё раз.",installed:"Muhajeer Books уже установлен ✅",installedBtn:"✅ УСТАНОВЛЕНО — ОТКРЫТЬ",small:"Телефон и язык определяются автоматически."},
    en:{tag:"Uzbek bookstore in Korea",title:"Install Muhajeer Books",lead:"Tap one button. Then open Muhajeer Books from your Home Screen like a regular app.",install:"📲 INSTALL",open:"Open app now",preparing:"Preparing install…",androidReady:"Ready — tap INSTALL.",androidHelp:"If the install window does not appear",androidSteps:["Open Chrome menu <b>⋮</b>.","Choose <b>Install app / Add to Home screen</b>."],iosReady:"Tap INSTALL — the Share sheet will open.",iosHelp:"Final 2 steps on iPhone",iosSteps:["Tap <b>Add to Home Screen / 홈 화면에 추가 / На экран «Домой»</b>.","Then tap <b>Add / 추가 / Добавить</b>."],iosSafari:"If the button does not work, open this link in <b>Safari</b> and tap it again.",installed:"Muhajeer Books is already installed ✅",installedBtn:"✅ INSTALLED — OPEN",small:"Phone and language are detected automatically."},
    ko:{tag:"한국의 우즈베크어 서점",title:"Muhajeer Books 설치",lead:"버튼 한 번만 누르세요. 설치 후 홈 화면에서 일반 앱처럼 바로 열 수 있습니다.",install:"📲 설치하기",open:"지금 앱 열기",preparing:"설치를 준비하고 있습니다…",androidReady:"준비 완료 — “설치하기”를 누르세요.",androidHelp:"설치 창이 뜨지 않으면",androidSteps:["Chrome 메뉴 <b>⋮</b> 를 누르세요.","<b>앱 설치 / 홈 화면에 추가</b>를 선택하세요."],iosReady:"“설치하기”를 누르면 공유 창이 열립니다.",iosHelp:"iPhone 마지막 2단계",iosSteps:["열린 창에서 <b>“홈 화면에 추가 / Add to Home Screen / На экран «Домой»”</b>를 누르세요.","그다음 <b>“추가 / Add / Добавить”</b>를 누르세요."],iosSafari:"버튼이 작동하지 않으면 이 링크를 <b>Safari</b>에서 열고 다시 누르세요.",installed:"Muhajeer Books가 이미 설치되어 있습니다 ✅",installedBtn:"✅ 설치됨 — 열기",small:"휴대폰과 언어가 자동으로 감지됩니다."}
  };

  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const langPrefix = (navigator.language || 'uz').toLowerCase().slice(0,2);
  let lang = ['uz','ru','en','ko'].includes(langPrefix) ? langPrefix : 'uz';
  let deferredPrompt = null;

  const btn = document.getElementById('installBtn');
  const status = document.getElementById('status');
  const help = document.getElementById('help');
  const helpTitle = document.getElementById('helpTitle');
  const helpBody = document.getElementById('helpBody');

  function rows(items){ return items.map((x,i)=>`<div class="help-row"><span class="num">${i+1}</span><span>${x}</span></div>`).join(''); }

  function render(){
    const t = texts[lang];
    document.documentElement.lang = lang;
    document.getElementById('tagline').textContent = t.tag;
    document.getElementById('title').textContent = t.title;
    document.getElementById('lead').textContent = t.lead;
    document.getElementById('openBtn').textContent = t.open;
    document.getElementById('small').textContent = t.small;
    document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));

    help.classList.remove('show');
    status.className = 'status';

    if (isStandalone){
      btn.disabled = false;
      btn.textContent = t.installedBtn;
      status.className = 'status ok';
      status.textContent = t.installed;
      return;
    }

    btn.textContent = t.install;
    btn.disabled = false;
    if (isIOS){
      status.innerHTML = t.iosReady;
    } else if (deferredPrompt){
      status.textContent = t.androidReady;
    } else {
      status.textContent = t.preparing;
    }
  }

  function showHelp(type){
    const t = texts[lang];
    help.classList.add('show');
    if(type==='ios'){
      helpTitle.textContent = t.iosHelp;
      helpBody.innerHTML = rows(t.iosSteps);
      status.className = 'status warn';
      status.innerHTML = t.iosSafari;
    } else {
      helpTitle.textContent = t.androidHelp;
      helpBody.innerHTML = rows(t.androidSteps);
      status.className = 'status warn';
      status.innerHTML = t.androidHelp;
    }
    help.scrollIntoView({behavior:'smooth',block:'center'});
  }

  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    deferredPrompt = e;
    render();
  });

  window.addEventListener('appinstalled', ()=>{
    deferredPrompt = null;
    render();
  });

  document.querySelectorAll('.lang').forEach(x=>x.addEventListener('click',()=>{lang=x.dataset.lang;render();}));

  btn.addEventListener('click', async ()=>{
    const t = texts[lang];
    if (isStandalone){ location.replace('/'); return; }

    if (isIOS){
      try{
        if (navigator.share){
          await navigator.share({title:'Muhajeer Books',text:'Muhajeer Books',url:location.origin+'/'});
        }
      }catch(_){ }
      showHelp('ios');
      return;
    }

    if (deferredPrompt){
      const p = deferredPrompt;
      deferredPrompt = null;
      await p.prompt();
      const choice = await p.userChoice.catch(()=>null);
      if (!choice || choice.outcome !== 'accepted') showHelp('android');
      return;
    }

    showHelp('android');
  });

  render();
  if (!isIOS) setTimeout(()=>{ if(!deferredPrompt && !isStandalone){ status.textContent=texts[lang].androidHelp; } },1800);
})();
</script>
</body>
</html>
